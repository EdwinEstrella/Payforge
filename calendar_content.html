<div class="space-y-8 animate-in fade-in duration-500">
    <!-- Header -->
    <div class="flex items-center justify-between">
        <div>
            <h2 class="text-display-lg text-slate-100">Calendario de Proyectos</h2>
            <p class="text-slate-400 font-medium">Visualiza hitos, vencimientos y fechas clave de tus contratos y propuestas.</p>
        </div>
        <div class="flex items-center gap-4 bg-slate-900/80 px-4 py-2 rounded-xl border border-slate-700 shadow-sm">
            <button onclick="changeMonth(-1)" class="p-1 hover:bg-slate-800/80 rounded-lg transition-colors">
                <span class="material-symbols-outlined">chevron_left</span>
            </button>
            <h3 id="calendar-month-year" class="text-sm font-bold text-slate-100 min-w-[120px] text-center uppercase tracking-wider">--</h3>
            <button onclick="changeMonth(1)" class="p-1 hover:bg-slate-800/80 rounded-lg transition-colors">
                <span class="material-symbols-outlined">chevron_right</span>
            </button>
        </div>
    </div>

    <!-- Calendar Grid -->
    <div class="bg-slate-900/80 rounded-3xl border border-slate-700 shadow-xl overflow-hidden">
        <div class="grid grid-cols-7 border-b border-slate-800 bg-slate-900/70/50">
            <div class="px-4 py-3 text-center text-[10px] font-bold text-slate-400 uppercase tracking-widest">Dom</div>
            <div class="px-4 py-3 text-center text-[10px] font-bold text-slate-400 uppercase tracking-widest">Lun</div>
            <div class="px-4 py-3 text-center text-[10px] font-bold text-slate-400 uppercase tracking-widest">Mar</div>
            <div class="px-4 py-3 text-center text-[10px] font-bold text-slate-400 uppercase tracking-widest">Mié</div>
            <div class="px-4 py-3 text-center text-[10px] font-bold text-slate-400 uppercase tracking-widest">Jue</div>
            <div class="px-4 py-3 text-center text-[10px] font-bold text-slate-400 uppercase tracking-widest">Vie</div>
            <div class="px-4 py-3 text-center text-[10px] font-bold text-slate-400 uppercase tracking-widest">Sáb</div>
        </div>
        <div id="calendar-grid" class="grid grid-cols-7 auto-rows-[120px]">
            <!-- Calendar days will be injected here -->
        </div>
    </div>

    <!-- Legend -->
    <div class="flex flex-wrap gap-6 bg-slate-900/80 p-6 rounded-2xl border border-slate-700 shadow-sm">
        <div class="flex items-center gap-2">
            <span class="w-3 h-3 rounded-full bg-blue-500"></span>
            <span class="text-xs font-bold text-slate-300 uppercase tracking-tighter">Contrato Creado</span>
        </div>
        <div class="flex items-center gap-2">
            <span class="w-3 h-3 rounded-full bg-green-500"></span>
            <span class="text-xs font-bold text-slate-300 uppercase tracking-tighter">Contrato Firmado</span>
        </div>
        <div class="flex items-center gap-2">
            <span class="w-3 h-3 rounded-full bg-red-500"></span>
            <span class="text-xs font-bold text-slate-300 uppercase tracking-tighter">Vencimiento Contrato</span>
        </div>
        <div class="flex items-center gap-2">
            <span class="w-3 h-3 rounded-full bg-purple-500"></span>
            <span class="text-xs font-bold text-slate-300 uppercase tracking-tighter">Propuesta Creada</span>
        </div>
        <div class="flex items-center gap-2">
            <span class="w-3 h-3 rounded-full bg-amber-500"></span>
            <span class="text-xs font-bold text-slate-300 uppercase tracking-tighter">Vencimiento Propuesta</span>
        </div>
    </div>
</div>
