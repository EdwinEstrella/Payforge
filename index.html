<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Stripe Admin - Login</title>
    <meta http-equiv="Content-Security-Policy" content="script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdn.jsdelivr.net; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:;" />
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <style>
        /* Ocultar barra de scroll para Chrome, Safari y Opera */
        ::-webkit-scrollbar {
            display: none;
        }

        /* Ocultar barra de scroll para IE, Edge y Firefox */
        html {
            -ms-overflow-style: none;  /* IE and Edge */
            scrollbar-width: none;  /* Firefox */
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
        }

        body {
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            line-height: 20px;
            font-weight: 400;
            background-color: #fcf8fa;
            color: #1b1b1d;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            display: flex;
            flex-direction: column;
        }

        .titlebar {
            -webkit-app-region: drag;
            height: 32px;
            background-color: #f5f5f5;
            border-bottom: 1px solid #e0e0e0;
            display: flex;
            align-items: center;
            padding: 0 12px;
            user-select: none;
            flex-shrink: 0;
        }

        .titlebar-title {
            font-size: 12px;
            font-weight: 500;
            color: #333;
            flex-grow: 1;
        }

        .titlebar-controls {
            -webkit-app-region: no-drag;
            display: flex;
            gap: 0;
            margin-left: auto;
        }

        .titlebar-btn {
            width: 46px;
            height: 32px;
            border: none;
            background: transparent;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #333;
            transition: background-color 0.15s ease;
        }

        .titlebar-btn:hover {
            background-color: rgba(0, 0, 0, 0.05);
        }

        .titlebar-btn.close:hover {
            background-color: #e81123;
            color: white;
        }

        .titlebar-btn svg {
            width: 12px;
            height: 12px;
            stroke: currentColor;
            fill: none;
            stroke-width: 1.5;
        }

        main {
            flex: 1;
            overflow: auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        .brand-section {
            margin-bottom: 40px;
            text-align: center;
        }

        .brand-icon {
            width: 80px;
            height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 12px;
        }

        .brand-icon .material-symbols-outlined {
            color: white;
            font-size: 24px;
        }

        .brand-title {
            font-family: 'Manrope', sans-serif;
            font-size: 24px;
            line-height: 32px;
            font-weight: 600;
            letter-spacing: -0.01em;
            color: #000000;
            margin-top: 0;
        }

        .brand-subtitle {
            font-size: 14px;
            line-height: 20px;
            color: #76777d;
            margin-top: 4px;
        }

        .login-card {
            width: 100%;
            max-width: 440px;
            background-color: #ffffff;
            border: 1px solid #c6c6cd;
            padding: 40px;
            border-radius: 8px;
            box-shadow: 0px 4px 12px rgba(15, 23, 42, 0.04);
        }

        .card-header {
            margin-bottom: 24px;
            text-align: center;
        }

        .card-title {
            font-family: 'Manrope', sans-serif;
            font-size: 20px;
            line-height: 28px;
            font-weight: 600;
            color: #1b1b1d;
            margin-bottom: 4px;
        }

        .card-subtitle {
            font-size: 14px;
            line-height: 20px;
            color: #76777d;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-label {
            font-family: 'Inter', sans-serif;
            font-size: 12px;
            line-height: 16px;
            letter-spacing: 0.05em;
            font-weight: 600;
            color: #505f76;
            text-transform: uppercase;
            display: block;
            margin-bottom: 4px;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-icon {
            position: absolute;
            left: 12px;
            color: #76777d;
            pointer-events: none;
            font-size: 20px;
            display: flex;
            align-items: center;
        }

        .input-wrapper.focused .input-icon {
            color: #b7c8e1;
        }

        input[type="email"],
        input[type="password"],
        input[type="text"] {
            width: 100%;
            padding: 12px 16px 12px 40px;
            background-color: #fcf8fa;
            border: 1px solid #c6c6cd;
            border-radius: 6px;
            font-size: 14px;
            line-height: 20px;
            font-weight: 400;
            color: #1b1b1d;
            font-family: 'Inter', sans-serif;
            transition: all 0.2s ease;
            outline: none;
        }

        input[type="email"]:focus,
        input[type="password"]:focus,
        input[type="text"]:focus {
            border-color: #505f76;
            box-shadow: 0 0 0 2px #d0e1fb;
        }

        input::placeholder {
            color: rgba(118, 119, 125, 0.5);
        }

        .password-group {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 4px;
        }

        .forgot-link {
            font-size: 12px;
            line-height: 16px;
            letter-spacing: 0.05em;
            font-weight: 600;
            color: #54647a;
            text-decoration: none;
            text-transform: uppercase;
            transition: color 0.2s ease;
        }

        .forgot-link:hover {
            color: #000000;
        }

        .toggle-password {
            position: absolute;
            right: 12px;
            background: none;
            border: none;
            cursor: pointer;
            color: #76777d;
            padding: 4px;
            display: flex;
            align-items: center;
            transition: color 0.2s ease;
        }

        .toggle-password:hover {
            color: #505f76;
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 8px;
            padding-top: 4px;
            margin-bottom: 24px;
        }

        input[type="checkbox"] {
            width: 16px;
            height: 16px;
            border: 1px solid #c6c6cd;
            border-radius: 3px;
            cursor: pointer;
            accent-color: #000000;
        }

        .checkbox-label {
            font-size: 14px;
            line-height: 20px;
            color: #45464d;
            cursor: pointer;
            user-select: none;
        }

        .submit-btn {
            width: 100%;
            padding: 12px 16px;
            background-color: #000000;
            color: white;
            font-family: 'Manrope', sans-serif;
            font-size: 16px;
            line-height: 24px;
            font-weight: 600;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        .submit-btn:hover {
            background-color: #2a2a2a;
        }

        .submit-btn:active {
            transform: scale(0.98);
        }

        .divider {
            margin: 24px 0;
            padding-top: 16px;
            border-top: 1px solid #c6c6cd;
        }

        .google-btn {
            width: 100%;
            padding: 12px 16px;
            background-color: #f6f3f5;
            border: 1px solid #c6c6cd;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-size: 14px;
            line-height: 20px;
            color: #1b1b1d;
            font-family: 'Inter', sans-serif;
            font-weight: 400;
        }

        .google-btn:hover {
            background-color: #f0edef;
        }

        .google-logo {
            width: 20px;
            height: 20px;
        }

        footer {
            margin-top: 40px;
            display: flex;
            gap: 24px;
            color: #76777d;
            font-family: 'Inter', sans-serif;
            font-size: 12px;
            line-height: 16px;
            letter-spacing: 0.05em;
            font-weight: 600;
        }

        footer a {
            color: #76777d;
            text-decoration: none;
            text-transform: uppercase;
            transition: color 0.2s ease;
        }

        footer a:hover {
            color: #505f76;
        }

        .decorative-bg {
            position: fixed;
            pointer-events: none;
            z-index: -1;
            border-radius: 50%;
            filter: blur(120px);
        }

        .bg-top-right {
            top: 0;
            right: 0;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(208, 225, 251, 0.2) 0%, transparent 70%);
        }

        .bg-bottom-left {
            bottom: 0;
            left: 0;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(220, 217, 219, 0.3) 0%, transparent 70%);
            filter: blur(100px);
        }

        .material-symbols-outlined {
            font-family: 'Material Symbols Outlined';
            font-weight: normal;
            font-style: normal;
            font-size: 24px;
            display: inline-block;
            line-height: 1;
            text-transform: none;
            letter-spacing: normal;
            word-wrap: normal;
            white-space: nowrap;
            direction: ltr;
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
</head>
<body>
    <!-- Custom Titlebar -->
    <div class="titlebar">
        <div class="titlebar-title">Stripe Admin - Login</div>
        <div class="titlebar-controls">
            <button class="titlebar-btn" id="min-btn" title="Minimize">
                <svg viewBox="0 0 12 12"><rect x="1" y="5" width="10" height="1"/></svg>
            </button>
            <button class="titlebar-btn" id="max-btn" title="Maximize">
                <svg id="max-icon" viewBox="0 0 12 12"><rect x="1" y="1" width="10" height="10"/></svg>
                <svg id="restore-icon" viewBox="0 0 12 12" style="display: none;">
                    <rect x="1" y="3" width="8" height="8"/>
                    <polyline points="3 3 3 1 11 1 11 9" fill="none"/>
                </svg>
            </button>
            <button class="titlebar-btn close" id="close-btn" title="Close">
                <svg viewBox="0 0 12 12"><path d="M1 1L11 11M11 1L1 11"/></svg>
            </button>
        </div>
    </div>

    <main>
        <!-- Login Card -->
        <div class="login-card">
            <!-- Logo and Brand Section inside the card -->
            <div class="brand-section" style="margin-bottom: 32px;">
                <div class="brand-icon">
                    <img src="logo_blanco_negro.png" alt="Logo Payforge" style="width: 100%; height: 100%; object-fit: contain;" />
                </div>
                <h1 class="brand-title">Payforge</h1>
            </div>

            <div class="card-header">
                <h2 class="card-title">Bienvenido de nuevo</h2>
                <p class="card-subtitle">Por favor, ingresá tus datos para iniciar sesión.</p>
            </div>

            <form id="loginForm">
                <!-- Email Field -->
                <div class="form-group">
                    <label class="form-label" for="email">Correo Electrónico</label>
                    <div class="input-wrapper">
                        <span class="input-icon material-symbols-outlined">mail</span>
                        <input type="email" id="email" name="email" placeholder="nombre@empresa.com" required />
                    </div>
                </div>

                <!-- Password Field -->
                <div class="form-group">
                    <div class="password-group">
                        <label class="form-label" for="password">Contraseña</label>
                        <a class="forgot-link" href="#">¿Olvidaste tu contraseña?</a>
                    </div>
                    <div class="input-wrapper">
                        <span class="input-icon material-symbols-outlined">lock</span>
                        <input type="password" id="password" name="password" placeholder="••••••••" required />
                        <button class="toggle-password" id="togglePassword" type="button">
                            <span class="material-symbols-outlined">visibility</span>
                        </button>
                    </div>
                </div>

                <!-- Checkboxes -->
                <div class="checkbox-group" style="margin-bottom: 8px;">
                    <input type="checkbox" id="remember" name="remember" />
                    <label class="checkbox-label" for="remember">Mantener sesión iniciada por 30 días</label>
                </div>

                <div class="checkbox-group" style="margin-bottom: 24px;">
                    <input type="checkbox" id="rememberUser" name="rememberUser" />
                    <label class="checkbox-label" for="rememberUser">Recordar usuario</label>
                </div>

                <!-- Submit Button -->
                <button class="submit-btn" type="submit">
                    Iniciar Sesión
                    <span class="material-symbols-outlined">arrow_forward</span>
                </button>
            </form>

            <!-- Updater Info -->
            <div id="updater-container" style="margin-top: 24px; text-align: center; font-size: 11px; color: #76777d; font-family: 'Inter', sans-serif; text-transform: uppercase; letter-spacing: 0.05em; font-weight: 600;">
                <div id="app-version" style="margin-bottom: 4px;">Versión --</div>
                <div id="updater-status" style="display: none; color: #505f76; background: #f6f3f5; padding: 6px; border-radius: 4px;">
                    <!-- status text -->
                </div>
            </div>

            <!-- Divider and Google Sign In -->
            <div class="divider">
                <button class="google-btn" id="googleSignIn" type="button">
                    <img alt="Google Logo" class="google-logo" src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='%234285F4' d='M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z'/%3E%3Cpath fill='%3434A853' d='M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z'/%3E%3Cpath fill='%23FBBC05' d='M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z'/%3E%3Cpath fill='%23EA4335' d='M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z'/%3E%3Cpath fill='none' d='M1 1h22v22H1z'/%3E%3C/svg%3E" />
                    Continuar con Google
                </button>
            </div>
        </div>

        <!-- Footer Links -->
        <footer>
            <a href="#">Política de Privacidad</a>
            <a href="#">Términos de Servicio</a>
            <a href="#">Seguridad</a>
        </footer>
    </main>

    <!-- Decorative background elements -->
    <div class="decorative-bg bg-top-right"></div>
    <div class="decorative-bg bg-bottom-left"></div>

    <script>
        // Titlebar controls
        document.getElementById('min-btn').addEventListener('click', () => {
            window.electronAPI.minimize()
        })

        document.getElementById('max-btn').addEventListener('click', () => {
            window.electronAPI.maximize()
        })

        document.getElementById('close-btn').addEventListener('click', () => {
            window.electronAPI.close()
        })

        // Check if "Remember User" is set on load
        window.addEventListener('DOMContentLoaded', () => {
            const savedEmail = localStorage.getItem('rememberedEmail')
            const savedPassword = localStorage.getItem('rememberedPassword')
            
            if (savedEmail) {
                document.getElementById('email').value = savedEmail
                document.getElementById('rememberUser').checked = true
            }
            if (savedPassword) {
                document.getElementById('password').value = savedPassword
            }
        })

        // Update maximize/restore icon
        const updateMaximizeIcon = (isMaximized) => {
            const maxIcon = document.getElementById('max-icon')
            const restoreIcon = document.getElementById('restore-icon')
            const maxBtn = document.getElementById('max-btn')

            if (isMaximized) {
                maxIcon.style.display = 'none'
                restoreIcon.style.display = 'block'
                maxBtn.title = 'Restore'
            } else {
                maxIcon.style.display = 'block'
                restoreIcon.style.display = 'none'
                maxBtn.title = 'Maximize'
            }
        }

        // Listen for window state changes
        window.electronAPI.onWindowMaximized(updateMaximizeIcon)

        // Toggle password visibility
        document.getElementById('togglePassword').addEventListener('click', (e) => {
            e.preventDefault()
            const passwordInput = document.getElementById('password')
            const toggleBtn = document.getElementById('togglePassword')
            const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password'
            passwordInput.setAttribute('type', type)
        })

        // Handle login form submission
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault()
            const email = document.getElementById('email').value
            const password = document.getElementById('password').value
            const rememberUser = document.getElementById('rememberUser').checked
            
            const submitBtn = e.target.querySelector('.submit-btn')
            const originalBtnContent = submitBtn.innerHTML
            
            try {
                // Indicador de carga
                submitBtn.disabled = true
                submitBtn.innerHTML = 'Iniciando sesión...'
                
                console.log('Login attempt with Insforge:', { email })
                const { data, error } = await window.electronAPI.login(email, password)

                if (error) {
                    console.error('Login error:', error)
                    alert('Error al iniciar sesión: ' + (error.message || 'Credenciales inválidas'))
                    submitBtn.disabled = false
                    submitBtn.innerHTML = originalBtnContent
                    return
                }

                if (data && data.accessToken) {
                    console.log('Login successful!', data.user.email)
                    
                    // Lógica de recordar usuario y contraseña
                    if (rememberUser) {
                        localStorage.setItem('rememberedEmail', email)
                        localStorage.setItem('rememberedPassword', password)
                    } else {
                        localStorage.removeItem('rememberedEmail')
                        localStorage.removeItem('rememberedPassword')
                    }

                    // Redirigir al layout maestro
                    window.location.href = 'layout.html'
                } else {
                    throw new Error('No se recibió el token de acceso')
                }
            } catch (err) {
                console.error('Unexpected error:', err)
                alert('Ocurrió un error inesperado. Por favor, intentá de nuevo.')
                submitBtn.disabled = false
                submitBtn.innerHTML = originalBtnContent
            }
        })

        // Handle Google Sign In
        document.getElementById('googleSignIn').addEventListener('click', () => {
            console.log('Google Sign In clicked')
            alert('Google Sign In - Integración pendiente')
            // Add your Google auth logic here
        })

        // Add focus class to input wrappers
        document.querySelectorAll('input[type="email"], input[type="password"]').forEach(input => {
            input.addEventListener('focus', function() {
                this.parentElement.classList.add('focused')
            })
            input.addEventListener('blur', function() {
                this.parentElement.classList.remove('focused')
            })
        })

        // Updater logic
        window.addEventListener('DOMContentLoaded', async () => {
            const version = await window.electronAPI.getAppVersion()
            document.getElementById('app-version').innerText = `Versión ${version}`

            const updaterStatus = document.getElementById('updater-status')
            
            window.electronAPI.onUpdateEvents({
                onChecking: () => {
                    updaterStatus.style.display = 'block'
                    updaterStatus.innerText = 'Buscando actualizaciones...'
                },
                onUpdateAvailable: (info) => {
                    updaterStatus.style.display = 'block'
                    updaterStatus.style.color = '#0066cc'
                    updaterStatus.style.backgroundColor = '#e6f0fa'
                    updaterStatus.innerText = 'Actualización disponible. Descargando...'
                },
                onUpdateNotAvailable: () => {
                    updaterStatus.style.display = 'none'
                },
                onDownloadProgress: (progress) => {
                    updaterStatus.style.display = 'block'
                    updaterStatus.style.color = '#0066cc'
                    updaterStatus.style.backgroundColor = '#e6f0fa'
                    updaterStatus.innerText = `Descargando: ${Math.round(progress.percent)}%`
                },
                onUpdateDownloaded: (info) => {
                    updaterStatus.style.display = 'block'
                    updaterStatus.style.color = '#10b981'
                    updaterStatus.style.backgroundColor = '#ecfdf5'
                    updaterStatus.innerHTML = `Actualización lista. <a href="#" id="install-update-btn" style="color: #10b981; text-decoration: underline;">Instalar y reiniciar</a>`
                    
                    document.getElementById('install-update-btn').addEventListener('click', (e) => {
                        e.preventDefault()
                        window.electronAPI.installUpdate()
                    })
                },
                onUpdateError: (err) => {
                    updaterStatus.style.display = 'block'
                    updaterStatus.style.color = '#ef4444'
                    updaterStatus.style.backgroundColor = '#fef2f2'
                    updaterStatus.innerText = `Error de actualización`
                    console.error('Update error:', err)
                }
            })
        })
    </script>
</body>
</html>
