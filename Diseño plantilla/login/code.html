<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

                        "on-secondary": "#ffffff",

                        "surface-tint": "#565e74",
                        "surface-container": "#f0edef",
                        "error": "#ba1a1a",
                        "on-primary-fixed": "#131b2e",
                        "secondary-container": "#d0e1fb",
                        "primary": "#000000",
                        "on-tertiary-fixed": "#191c1e",
                        "secondary-fixed-dim": "#b7c8e1",
                        "primary-container": "#131b2e",
                        "on-secondary-fixed-variant": "#38485d",
                        "error-container": "#ffdad6",
                        "surface-container-low": "#f6f3f5",
                        "secondary": "#505f76",
                        "background": "#fcf8fa",
                        "tertiary": "#000000",
                        "on-secondary-fixed": "#0b1c30",
                        "on-tertiary-container": "#818486",

                        "on-tertiary-fixed-variant": "#444749",
                        "tertiary-fixed": "#e0e3e5",
                        "surface-container-high": "#eae7e9",
                        "on-background": "#1b1b1d",
                        "surface-bright": "#fcf8fa",

                        "on-error-container": "#93000a",
                        "on-tertiary": "#ffffff",
                        "surface": "#fcf8fa",

                        "on-primary-fixed-variant": "#3f465c",

                        "primary-fixed": "#dae2fd",

                    "borderRadius": {
                        "DEFAULT": "0.125rem",
                        "lg": "0.25rem",
                        "xl": "0.5rem",
                        "full": "0.75rem"
                    },
                    "spacing": {
                        "sidebar-width": "260px",
                        "xs": "4px",
                        "xl": "40px",
                        "sm": "8px",
                        "lg": "24px",
                        "md": "16px",
                        "base": "4px",
                        "container-max": "1440px"
                    },
                    "fontFamily": {
                        "headline-sm": ["Manrope"],
                        "body-md": ["Inter"],
                        "headline-md": ["Manrope"],
                        "display-lg": ["Manrope"],
                        "label-caps": ["Inter"],
                        "body-lg": ["Inter"],
                        "data-mono": ["Inter"]
                    },
                    "fontSize": {
                        "headline-sm": ["20px", {"lineHeight": "28px", "fontWeight": "600"}],
                        "body-md": ["14px", {"lineHeight": "20px", "fontWeight": "400"}],
                        "headline-md": ["24px", {"lineHeight": "32px", "letterSpacing": "-0.01em", "fontWeight": "600"}],
                        "display-lg": ["36px", {"lineHeight": "44px", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                        "label-caps": ["12px", {"lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "600"}],
                        "body-lg": ["16px", {"lineHeight": "24px", "fontWeight": "400"}],
                        "data-mono": ["14px", {"lineHeight": "20px", "letterSpacing": "0.01em", "fontWeight": "500"}]
                    }
                }
            }
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        body {
            background-color: #fcf8fa;
        }
    </style>
</head>
<body class="font-body-md text-on-surface antialiased">
<main class="min-h-screen flex flex-col items-center justify-center p-lg">
<!-- Logo and Brand Section -->
<div class="mb-xl text-center">
<div class="flex items-center justify-center gap-sm mb-sm">
<div class="w-10 h-10 bg-primary flex items-center justify-center rounded-lg shadow-sm">
<span class="material-symbols-outlined text-white" data-icon="payments">payments</span>
</div>
<h1 class="font-headline-md text-headline-md text-primary tracking-tight">Stripe Admin</h1>
</div>
<p class="font-body-md text-body-md text-outline">Financial Operations Dashboard</p>
</div>
<!-- Login Card -->
<div class="w-full max-w-[440px] bg-surface-container-lowest border border-outline-variant p-xl rounded-xl shadow-[0px_4px_12px_rgba(15,23,42,0.04)]">
<div class="mb-lg">
<h2 class="font-headline-sm text-headline-sm text-on-surface mb-xs">Welcome back</h2>
<p class="font-body-md text-body-md text-outline">Please enter your details to sign in.</p>
</div>
<form class="space-y-md">
<!-- Email Field -->
<div class="space-y-xs">
<label class="font-label-caps text-label-caps text-secondary uppercase" for="email">Email Address</label>
<div class="relative group">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline text-[20px] group-focus-within:text-secondary-fixed-dim transition-colors" data-icon="mail">mail</span>
<input class="w-full pl-10 pr-4 py-3 bg-surface-bright border border-outline-variant rounded-lg focus:ring-2 focus:ring-secondary-container focus:border-secondary transition-all outline-none text-body-md font-body-md placeholder:text-outline/50" id="email" name="email" placeholder="name@company.com" required="" type="email"/>
</div>
</div>
<!-- Password Field -->
<div class="space-y-xs">
<div class="flex justify-between items-center">
<label class="font-label-caps text-label-caps text-secondary uppercase" for="password">Password</label>
<a class="font-label-caps text-label-caps text-on-secondary-container hover:text-primary transition-colors" href="#">Forgot password?</a>
</div>
<div class="relative group">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline text-[20px] group-focus-within:text-secondary-fixed-dim transition-colors" data-icon="lock">lock</span>
<input class="w-full pl-10 pr-12 py-3 bg-surface-bright border border-outline-variant rounded-lg focus:ring-2 focus:ring-secondary-container focus:border-secondary transition-all outline-none text-body-md font-body-md placeholder:text-outline/50" id="password" name="password" placeholder="••••••••" required="" type="password"/>
<button class="absolute right-3 top-1/2 -translate-y-1/2 text-outline hover:text-secondary transition-colors" type="button">
<span class="material-symbols-outlined text-[20px]" data-icon="visibility">visibility</span>
</button>
</div>
</div>
<!-- Options -->
<div class="flex items-center gap-sm pt-xs">
<input class="w-4 h-4 rounded border-outline-variant text-primary focus:ring-primary" id="remember" type="checkbox"/>
<label class="font-body-md text-body-md text-on-surface-variant cursor-pointer" for="remember">Stay signed in for 30 days</label>
</div>
<!-- Submit Button -->
<button class="w-full mt-sm py-3 px-4 bg-primary text-white font-headline-sm text-[16px] rounded-lg hover:bg-zinc-800 active:scale-[0.98] transition-all flex items-center justify-center gap-sm shadow-md" type="submit">
                    Sign In
                    <span class="material-symbols-outlined text-[20px]" data-icon="arrow_forward">arrow_forward</span>
</button>
</form>
<div class="mt-lg pt-lg border-t border-outline-variant flex flex-col gap-md">
<button class="w-full py-3 px-4 bg-surface-container-low border border-outline-variant text-on-surface font-body-md text-body-md rounded-lg hover:bg-surface-container transition-all flex items-center justify-center gap-sm" type="button">
<img alt="Google Logo" class="w-5 h-5" data-alt="close up of google logo icon on white background with clean professional lighting" src="https://lh3.googleusercontent.com/aida-public/AB6AXuAGrn0RyBJOO2tVb3qUbfezt5STR27GRaWXLCdWpyKewtKkuYnJhbKzopEZwSlx-8d4_Vy0DAFtWahTUkRYXZ3IT_dRdrrtb-_a1r5Zzmq3I4O9JucPqoG3Ao2cLva6RU0hX0pQ5QJwXm-hhU8Le2JCj5Y0iVuKGIHEbU5v557ENiYsDmgk3CgDVo_Z11Ynb3QVFU__SWnscDXVVNQGy0xSc6wZqGsaB43h7q6JnxV1cXwJWvLn5qmco44U2C_HetOsM5WO7geMUFdQ"/>
                    Sign in with Google
                </button>
</div>
</div>
<!-- Footer Links -->
<footer class="mt-xl flex gap-lg text-outline font-label-caps text-label-caps">
<a class="hover:text-secondary transition-colors uppercase" href="#">Privacy Policy</a>
<a class="hover:text-secondary transition-colors uppercase" href="#">Terms of Service</a>
<a class="hover:text-secondary transition-colors uppercase" href="#">Security</a>
</footer>
</main>
<!-- Decorative background element -->
<div class="fixed top-0 right-0 -z-10 w-[600px] h-[600px] bg-gradient-to-bl from-secondary-container/20 to-transparent blur-[120px] rounded-full pointer-events-none"></div>
<div class="fixed bottom-0 left-0 -z-10 w-[400px] h-[400px] bg-gradient-to-tr from-surface-dim/30 to-transparent blur-[100px] rounded-full pointer-events-none"></div>
</body></html>
