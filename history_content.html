<div class="flex items-end justify-between mb-8">
    <div>
        <h1 class="font-headline-md text-headline-md text-slate-100 mb-1">Historial de Pagos</h1>
        <p class="font-body-md text-body-md text-slate-400">Registro cronológico de todas las transacciones reales procesadas vía Stripe.</p>
    </div>
    <div class="flex gap-3">
        <button class="flex items-center gap-2 px-4 py-2.5 bg-slate-800/80 hover:bg-slate-200 text-slate-200 font-bold text-sm rounded-lg transition-all border border-slate-700">
            <span class="material-symbols-outlined text-[18px]">download</span>
            Descargar Reporte
        </button>
    </div>
</div>

<div class="bg-slate-900/80 border border-slate-700 rounded-xl overflow-hidden shadow-sm">
    <div class="overflow-x-auto">
        <table class="w-full text-left border-collapse">
            <thead>
                <tr class="bg-slate-900/80 border-b border-slate-800">
                    <th class="px-6 py-4 font-label-caps text-label-caps text-slate-400 uppercase tracking-widest text-xs">Fecha</th>
                    <th class="px-6 py-4 font-label-caps text-label-caps text-slate-400 uppercase tracking-widest text-xs">Concepto / Cliente</th>
                    <th class="px-6 py-4 font-label-caps text-label-caps text-slate-400 uppercase tracking-widest text-xs">Monto</th>
                    <th class="px-6 py-4 font-label-caps text-label-caps text-slate-400 uppercase tracking-widest text-xs">Estado</th>
                    <th class="px-6 py-4 font-label-caps text-label-caps text-slate-400 uppercase tracking-widest text-xs text-right">Referencia</th>
                </tr>
            </thead>
            <tbody id="history-table-body" class="divide-y divide-slate-50">
                <tr>
                    <td colspan="5" class="px-6 py-12 text-center text-slate-400">
                        <div class="flex flex-col items-center gap-2">
                            <span class="material-symbols-outlined animate-spin">refresh</span>
                            Cargando historial real...
                        </div>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</div>
