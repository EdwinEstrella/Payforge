        /* Custom Titlebar for Electron */
        .titlebar {
            -webkit-app-region: drag;
            height: 32px;
            background-color: #f5f5f5;
            border-bottom: 1px solid #e0e0e0;
            display: flex;
            align-items: center;

            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 9999;

            font-size: 12px;
            font-weight: 500;
            color: #333;
            flex-grow: 1;
        }

            -webkit-app-region: no-drag;

            gap: 0;
            margin-left: auto;

        .titlebar-btn {
            width: 46px;
            height: 32px;
            border: none;
            background: transparent;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #333;
            transition: background-color 0.15s ease;
        }
        .titlebar-btn:hover {
            background-color: rgba(0, 0, 0, 0.05);
        }
        .titlebar-btn.close:hover {
            background-color: #e81123;
            color: white;
        }
        .titlebar-btn svg {
            width: 12px;
            height: 12px;
            stroke: currentColor;
            fill: none;
            stroke-width: 1.5;
        }
        /* Adjust layout for titlebar */
        aside, header {
            top: 32px !important;
            height: calc(100% - 32px) !important;
        }
        header {
            height: 64px !important;
        }
        #main-content {
            padding-top: calc(64px + 32px + 24px) !important;

</head>

    <script>
        // Titlebar controls
        document.getElementById('min-btn').addEventListener('click', () => {
            window.electronAPI.minimize()
        })

        document.getElementById('max-btn').addEventListener('click', () => {
            window.electronAPI.maximize()
        })

        document.getElementById('close-btn').addEventListener('click', () => {
            window.electronAPI.close()
        })

        const updateMaximizeIcon = (isMaximized) => {
            const maxIcon = document.getElementById('max-icon')
            const restoreIcon = document.getElementById('restore-icon')
            const maxBtn = document.getElementById('max-btn')
            if (isMaximized) {
                maxIcon.style.display = 'none'
                restoreIcon.style.display = 'block'
                maxBtn.title = 'Restaurar'
            } else {
                maxIcon.style.display = 'block'
                restoreIcon.style.display = 'none'
                maxBtn.title = 'Maximizar'
            }
        }
        window.electronAPI.onWindowMaximized(updateMaximizeIcon)

        // Logout
        document.getElementById('logout-btn').addEventListener('click', () => {
            window.location.href = 'index.html'
        })

        // SPA Navigation Logic
        const mainContent = document.getElementById('main-content');
        const navItems = document.querySelectorAll('.nav-item');

        async function loadPage(pageName) {
            try {
                const response = await fetch(`${pageName}_content.html`);
                const html = await response.text();
                mainContent.innerHTML = html;
                
                // Update active state in nav
                navItems.forEach(item => {
                    if (item.dataset.page === pageName) {
                        item.classList.add('bg-slate-800/50', 'text-white', 'font-semibold');
                        item.classList.remove('text-slate-400');
                    } else {
                        item.classList.remove('bg-slate-800/50', 'text-white', 'font-semibold');
                        item.classList.add('text-slate-400');
                    }
                });

                // Trigger page-specific logic
                if (pageName === 'dashboard') {
                    loadDashboard();
                } else if (pageName === 'clients') {
                    loadClients();
                    setupPaymentForm();
                } else if (pageName === 'history') {
                    loadHistory();
                } else if (pageName === 'links') {
                    loadLinks();
                } else if (pageName === 'contracts') {
                    loadContracts();
                }
            } catch (error) {
                console.error('Error loading page:', error);
                mainContent.innerHTML = '<h2>Error al cargar la página</h2>';
            }
        }

        // --- CONTRACTS PAGE LOGIC --- (MATCHED)

        const MASTER_CONTRACT_TEMPLATE = `# CONTRATO DE PRESTACIÓN DE SERVICIOS PROFESIONALES

        window.addInclusionRow = () => {
            const container = document.getElementById('inclusions-list');
            const div = document.createElement('div');
            div.className = 'flex gap-2 inclusion-item animate-in slide-in-from-left-2 duration-200';
            div.innerHTML = `
                <input type="text" placeholder="Nueva característica o entregable..." class="flex-1 rounded-lg border-slate-200 text-sm">
                <button type="button" onclick="this.parentElement.remove()" class="p-2 text-slate-400 hover:text-red-500">
                    <span class="material-symbols-outlined text-lg">delete</span>
                </button>
            `;
            container.appendChild(div);
        };

        async function loadContracts() {
            console.log('[Contracts] Cargando listado...');
            const tbody = document.getElementById('contracts-table-body');
            if (!tbody) return;

            const { data, error } = await window.electronAPI.getContracts();

            if (error) {
                tbody.innerHTML = `<tr><td colspan="5" class="px-6 py-8 text-center text-red-500">Error: ${error.message || error}</td></tr>`;
                return;
            }

            // Actualizar Stats
            document.getElementById('stat-total-contracts').innerText = data.length;
            document.getElementById('stat-pending-contracts').innerText = data.filter(c => c.status === 'pending').length;
            document.getElementById('stat-signed-contracts').innerText = data.filter(c => c.status === 'signed').length;
            document.getElementById('stat-cancelled-contracts').innerText = data.filter(c => c.status === 'cancelled').length;

            if (data.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" class="px-6 py-12 text-center text-slate-400 font-medium">No hay contratos registrados.</td></tr>`;
                return;
            }

            tbody.innerHTML = data.map(c => {
                const clientName = c.clients?.name || 'Cliente Desconocido';
                const projectName = c.description || 'Proyecto sin nombre';
                const amount = (c.amount || 0).toLocaleString('en-US', { style: 'currency', currency: c.currency || 'USD' });
                const expiry = new Date(c.expiry_at).toLocaleDateString();
                
                const statusMap = {
                    pending: { label: 'Pendiente', bg: 'bg-amber-100', text: 'text-amber-700' },
                    signed: { label: 'Firmado', bg: 'bg-green-100', text: 'text-green-700' },
                    cancelled: { label: 'Cancelado', bg: 'bg-red-100', text: 'text-red-700' }
                };
                const s = statusMap[c.status] || statusMap.pending;

                return `
                    <tr class="hover:bg-slate-50 border-b border-slate-50 transition-colors">
                        <td class="px-6 py-4">
                            <p class="text-sm font-bold text-slate-900">${projectName}</p>
                            <p class="text-xs text-slate-500">${clientName}</p>
                        </td>
                        <td class="px-6 py-4 text-sm font-semibold text-slate-700">${amount}</td>
                        <td class="px-6 py-4">
                            <span class="px-2 py-0.5 rounded-full text-[10px] font-bold uppercase ${s.bg} ${s.text}">
                                ${s.label}
                            </span>
                        </td>
                        <td class="px-6 py-4 text-xs text-slate-500 font-medium">${expiry}</td>
                        <td class="px-6 py-4 text-right">
                            <div class="flex justify-end gap-2">
                                ${c.status === 'pending' ? `
                                    <button onclick="copyContractLink('${c.token}')" class="p-1.5 hover:bg-blue-50 rounded text-blue-600" title="Copiar Link">
                                        <span class="material-symbols-outlined text-lg">link</span>
                                    </button>
                                    <button onclick="openCancelModal('${c.id}')" class="p-1.5 hover:bg-red-50 rounded text-red-600" title="Cancelar">
                                        <span class="material-symbols-outlined text-lg">cancel</span>
                                    </button>
                                ` : ''}
                                ${c.status === 'signed' ? `
                                    <button onclick="downloadContractPDF('${c.id}')" class="p-1.5 hover:bg-green-50 rounded text-green-600" title="Descargar PDF">
                                        <span class="material-symbols-outlined text-lg">picture_as_pdf</span>
                                    </button>
                                ` : ''}
                                <button onclick="deleteContract('${c.id}')" class="p-1.5 hover:bg-slate-100 rounded text-slate-400 hover:text-red-600" title="Eliminar registro">
                                    <span class="material-symbols-outlined text-lg">delete</span>
                                </button>
                            </div>
                        </td>
                    </tr>
                `;
            }).join('');
        }

        window.openContractModal = async () => {
            const modal = document.getElementById('contract-modal');
            const clientSelect = document.getElementById('contract-client');
            
            modal.classList.remove('hidden');

            // Cargar clientes
            const { data, error } = await window.electronAPI.getClients();
            if (data) {
                let optionsHTML = '<option value="">Selecciona...</option>';
                for(let i=0; i<data.length; i++) {
                    const cl = data[i];
                    optionsHTML += '<option value="' + cl.id + '" data-name="' + cl.name + '" data-email="' + cl.email + '">' + cl.name + '</option>';
                }
                clientSelect.innerHTML = optionsHTML;
            }
        };

        let isManualClient = false;
        window.toggleNewClient = () => {
            isManualClient = !isManualClient;
            const selectCont = document.getElementById('client-select-container');
            const manualCont = document.getElementById('client-manual-container');
            const btn = document.getElementById('toggle-client-btn');
            
            if (isManualClient) {
                selectCont.classList.add('hidden');
                manualCont.classList.remove('hidden');
                btn.innerText = 'Lista';
            } else {
                selectCont.classList.remove('hidden');
                manualCont.classList.add('hidden');
                btn.innerText = 'Manual';
            }
        };

        window.closeContractModal = () => {
            document.getElementById('contract-modal').classList.add('hidden');
            document.getElementById('contract-form').reset();

        async function loadDashboard() {
            console.log('[Dashboard] Iniciando carga de datos reales...');
            const elements = {
                revenue: document.getElementById('dash-revenue'),
                available: document.getElementById('dash-available'),
                pending: document.getElementById('dash-pending'),
                links: document.getElementById('dash-links'),
                chart: document.getElementById('dash-chart'),
                activity: document.getElementById('dash-activity')
            };

            if (!elements.revenue) return;

            try {
                // Obtener datos concurrentemente
                const [balanceRes, historyRes] = await Promise.all([
                    window.electronAPI.getBalance(),
                    window.electronAPI.getHistory()
                ]);

                if (balanceRes.error) throw new Error(balanceRes.error);
                if (historyRes.error) throw new Error(historyRes.error);

                const balance = balanceRes.data;
                const history = historyRes.data;

                // 1. Procesar Balance
                const availableAmount = (balance.available.reduce((acc, curr) => acc + curr.amount, 0)) / 100;
                const pendingAmount = (balance.pending.reduce((acc, curr) => acc + curr.amount, 0)) / 100;
                const totalRevenue = availableAmount + pendingAmount;
                const currency = balance.available[0]?.currency.toUpperCase() || 'USD';

                elements.revenue.innerText = totalRevenue.toLocaleString('en-US', { style: 'currency', currency });
                elements.available.innerText = availableAmount.toLocaleString('en-US', { style: 'currency', currency });
                elements.pending.innerText = pendingAmount.toLocaleString('en-US', { style: 'currency', currency });

                // 2. Procesar Historial (Links Exitosos y Actividad Reciente)
                const successfulPayments = history.filter(p => p.status === 'succeeded');
                elements.links.innerText = successfulPayments.length;

                // Actividad Reciente (últimos 4)
                if (history.length === 0) {
                    elements.activity.innerHTML = '<p class="text-xs text-slate-400 text-center py-4">No hay actividad reciente.</p>';
                } else {
                    elements.activity.innerHTML = history.slice(0, 5).map(item => {
                        const timeAgo = getTimeAgo(new Date(item.created_at));
                        const statusConfig = {
                            succeeded: { bg: 'bg-emerald-100', text: 'text-emerald-600', icon: 'check_circle' },
                            failed: { bg: 'bg-red-100', text: 'text-red-600', icon: 'error' },
                            expired: { bg: 'bg-slate-100', text: 'text-slate-500', icon: 'schedule' },
                            refunded: { bg: 'bg-amber-100', text: 'text-amber-600', icon: 'undo' }
                        };
                        const cfg = statusConfig[item.status] || statusConfig.failed;
                        return `
                            <div class="flex gap-4">
                                <div class="w-10 h-10 rounded-full ${cfg.bg} flex items-center justify-center shrink-0">
                                    <span class="material-symbols-outlined ${cfg.text} text-xl">${cfg.icon}</span>
                                </div>
                                <div class="flex-1">
                                    <p class="text-sm font-semibold text-slate-900 line-clamp-1">${item.description || 'Pago de servicio'}</p>
                                    <p class="text-xs text-slate-500">${timeAgo}</p>
                                    ${item.failure_reason ? `<p class="text-[10px] text-red-500 mt-0.5 line-clamp-1">${item.failure_reason}</p>` : ''}
                                </div>
                                <div class="text-right">
                                    <p class="text-sm font-bold text-slate-900">${(item.amount / 100).toLocaleString('en-US', { style: 'currency', currency: item.currency.toUpperCase() })}</p>
                                </div>
                            </div>
                        `;
                    }).join('');
                }

                // 3. Gráfico de Rendimiento (Últimos 10 días)
                const last10Days = Array.from({ length: 10 }, (_, i) => {
                    const d = new Date();
                    d.setDate(d.getDate() - (9 - i));
                    d.setHours(0, 0, 0, 0);
                    return d;
                });

                const dailyRevenue = last10Days.map(date => {
                    return history
                        .filter(p => p.status === 'succeeded' && new Date(p.created_at).toDateString() === date.toDateString())
                        .reduce((acc, curr) => acc + curr.amount, 0) / 100;
                });

                const maxRevenue = Math.max(...dailyRevenue, 1); // Evitar división por cero
                elements.chart.innerHTML = dailyRevenue.map((amount, i) => {
                    const height = (amount / maxRevenue) * 100;
                    const dateStr = last10Days[i].toLocaleDateString('es-ES', { day: '2-digit' });
                    return `
                        <div class="flex flex-col items-center gap-2 group relative h-full justify-end" style="width: 8%;">
                            <div class="absolute -top-8 bg-slate-900 text-white text-[10px] px-2 py-1 rounded opacity-0 group-hover:opacity-100 transition-opacity whitespace-nowrap z-10">
                                ${amount.toLocaleString('en-US', { style: 'currency', currency })}
                            </div>
                            <div class="w-full bg-blue-600 rounded-t-sm transition-all duration-500 hover:bg-blue-700" 
                                 style="height: ${Math.max(height, 5)}%"></div>
                            <span class="text-[10px] text-slate-400 font-medium">${dateStr}</span>
                        </div>
                    `;
                }).join('');

            } catch (err) {
                console.error('[Dashboard] Error cargando datos:', err);
                elements.revenue.innerHTML = '<span class="text-xs text-red-500">Error al cargar</span>';
            }
        }

        function getTimeAgo(date) {
            const seconds = Math.floor((new Date() - date) / 1000);
            let interval = seconds / 31536000;
            if (interval > 1) return `Hace ${Math.floor(interval)} años`;
            interval = seconds / 2592000;
            if (interval > 1) return `Hace ${Math.floor(interval)} meses`;
            interval = seconds / 86400;
            if (interval > 1) return `Hace ${Math.floor(interval)} días`;
            interval = seconds / 3600;
            if (interval > 1) return `Hace ${Math.floor(interval)} horas`;
            interval = seconds / 60;
            if (interval > 1) return `Hace ${Math.floor(interval)} minutos`;
            return 'Hace un momento';
        }

                document.getElementById('payment-description').value = '';
            }

            modal.classList.remove('hidden');
            document.getElementById('payment-result').classList.add('hidden');
        }

        window.closePaymentModal = () => {
            console.log('[UI] Cerrando modal de pago.');
            document.getElementById('payment-modal').classList.add('hidden');
            document.getElementById('payment-form').reset();
        }

        window.openPaymentModalFromDashboard = async () => {
            console.log('[Dashboard] Botón generar link clickeado.');
            await loadPage('clients');
            openPaymentModal('', '');
        }

        window.syncStripeData = async () => {
            if (!confirm('¿Quieres sincronizar los clientes desde Stripe?')) return;
            console.log('[Sync] Iniciando sincronización manual...');
            const btn = document.querySelector('button[onclick="syncStripeData()"]');
            if (!btn) return;
            const originalText = btn.innerHTML;
            
            btn.disabled = true;
            btn.innerHTML = '<span class="material-symbols-outlined animate-spin">refresh</span> Sincronizando...';
            
            const { data, error } = await window.electronAPI.syncStripeCustomers();
            
            btn.disabled = false;
            btn.innerHTML = originalText;
            
            if (error) {
                console.error('[Sync] Error:', error);
                alert('Error al sincronizar: ' + (error.message || error));
            } else {
                console.log('[Sync] Éxito:', data);
                alert('Sincronización completada con éxito.');
                loadClients();
            }
        }

        // Handle navigation clicks
        navItems.forEach(item => {
            item.addEventListener('click', () => {
                loadPage(item.dataset.page);
            });
        });

        // Load default page
        window.addEventListener('DOMContentLoaded', () => {
            loadPage('dashboard');
        });
    </script>
</body>
</html>
