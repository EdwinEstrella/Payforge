<html class="light" lang="es">
<head>

    <title>Payforge - Panel de Control</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>

                        "primary": "#000000",

                        "on-secondary-fixed-variant": "#38485d",

                        "secondary": "#505f76",

                        "primary-fixed-dim": "#bec6e0",
                        "surface-container-highest": "#e4e2e4",
                        "on-surface": "#1b1b1d",
                        "surface-container-lowest": "#ffffff",

                        "secondary-fixed": "#d3e4fe",

                        "display-lg": ["36px", { "lineHeight": "44px", "letterSpacing": "-0.02em", "fontWeight": "700" }],

    </script>
    <style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        body {
            background-color: #fcf8fa;
        }
        /* Custom Titlebar for Electron */
        .titlebar {
            -webkit-app-region: drag;
            height: 32px;
            background-color: #f5f5f5;
            border-bottom: 1px solid #e0e0e0;
            display: flex;
            align-items: center;
            padding: 0 12px;
            user-select: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 9999;
        }
        .titlebar-title {
            font-size: 12px;
            font-weight: 500;
            color: #333;
            flex-grow: 1;
        }
        .titlebar-controls {
            -webkit-app-region: no-drag;
            display: flex;
            gap: 0;
            margin-left: auto;
        }
        .titlebar-btn {
            width: 46px;
            height: 32px;
            border: none;
            background: transparent;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #333;
            transition: background-color 0.15s ease;
        }
        .titlebar-btn:hover {
            background-color: rgba(0, 0, 0, 0.05);
        }
        .titlebar-btn.close:hover {
            background-color: #e81123;
            color: white;
        }
        .titlebar-btn svg {
            width: 12px;
            height: 12px;
            stroke: currentColor;
            fill: none;
            stroke-width: 1.5;
        }
        /* Adjust layout for titlebar */
        aside, header {
            top: 32px !important;
            height: calc(100% - 32px) !important;
        }
        header {
            height: 64px !important;
        }
        #main-content {
            padding-top: calc(64px + 32px + 24px) !important;
        }
    </style>
</head>
<body class="font-body-md text-on-surface antialiased">
    <!-- Custom Titlebar -->
    <div class="titlebar">
        <div class="titlebar-title">Payforge - Sistema de Gestión</div>
        <div class="titlebar-controls">
            <button class="titlebar-btn" id="min-btn" title="Minimizar">
                <svg viewBox="0 0 12 12"><rect x="1" y="5" width="10" height="1"/></svg>
            </button>
            <button class="titlebar-btn" id="max-btn" title="Maximizar">
                <svg id="max-icon" viewBox="0 0 12 12"><rect x="1" y="1" width="10" height="10"/></svg>
                <svg id="restore-icon" viewBox="0 0 12 12" style="display: none;">
                    <rect x="1" y="3" width="8" height="8"/>
                    <polyline points="3 3 3 1 11 1 11 9" fill="none"/>
                </svg>
            </button>
            <button class="titlebar-btn close" id="close-btn" title="Cerrar">
                <svg viewBox="0 0 12 12"><path d="M1 1L11 11M11 1L1 11"/></svg>
            </button>
        </div>
    </div>

    <!-- SideNavBar -->
    <aside class="fixed left-0 w-64 border-r border-slate-800 bg-slate-950 dark:bg-black font-manrope antialiased tracking-tight flex flex-col p-4 z-50">
        <div class="mb-8 px-4 flex items-center gap-3">
            <div class="w-10 h-10 flex items-center justify-center">
                <img src="logo_blanco_negro.png" alt="Logo" class="w-full h-full object-contain filter invert" />
            </div>
            <div>
                <h1 class="text-white text-xl font-bold tracking-tight">Payforge</h1>
            </div>
        </div>
        <nav class="flex-1 space-y-1" id="nav-links">
            <a data-page="dashboard" class="nav-item flex items-center gap-3 px-4 py-3 bg-slate-800/50 text-white rounded-lg font-semibold cursor-pointer active:scale-[0.98] transition-transform duration-150">
                <span class="material-symbols-outlined">dashboard</span>
                Panel Principal
            </a>
            <a data-page="clients" class="nav-item flex items-center gap-3 px-4 py-3 text-slate-400 hover:text-white cursor-pointer transition-colors active:scale-[0.98] transition-transform duration-150">
                <span class="material-symbols-outlined">group</span>
                Clientes
            </a>
            <a data-page="history" class="nav-item flex items-center gap-3 px-4 py-3 text-slate-400 hover:text-white cursor-pointer transition-colors active:scale-[0.98] transition-transform duration-150">
                <span class="material-symbols-outlined">history</span>
                Historial
            </a>
            <a data-page="links" class="nav-item flex items-center gap-3 px-4 py-3 text-slate-400 hover:text-white cursor-pointer transition-colors active:scale-[0.98] transition-transform duration-150">
                <span class="material-symbols-outlined">link</span>
                Links Generados
            </a>
        </nav>
        <div class="mt-auto space-y-1 border-t border-slate-800 pt-4">
            <a class="flex items-center gap-3 px-4 py-3 text-slate-400 hover:text-white transition-colors cursor-pointer">
                <span class="material-symbols-outlined">settings</span>
                Configuración
            </a>
            <a class="flex items-center gap-3 px-4 py-3 text-slate-400 hover:text-white transition-colors cursor-pointer">
                <span class="material-symbols-outlined">help</span>
                Soporte
            </a>
            <div class="mt-4 px-4">
                <button id="logout-btn" class="w-full py-2.5 bg-slate-800 hover:bg-red-600 text-white rounded-lg font-semibold text-sm transition-all active:scale-95 flex items-center justify-center gap-2">
                    <span class="material-symbols-outlined text-sm">logout</span>
                    Cerrar Sesión
                </button>
            </div>
        </div>
    </aside>

    <!-- TopAppBar -->
    <header class="fixed right-0 w-[calc(100%-16rem)] border-b border-slate-200 dark:border-slate-800 bg-white/80 dark:bg-slate-900/80 backdrop-blur-md flex items-center justify-between px-8 z-40 font-manrope text-sm font-medium">
        <div class="flex items-center gap-4 flex-1">
            <div class="relative w-full max-w-md">
                <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-lg">search</span>
                <input class="w-full pl-10 pr-4 py-2 bg-slate-50 dark:bg-slate-800 border-none rounded-full text-sm focus:ring-2 focus:ring-blue-500/20 transition-all" placeholder="Buscar..." type="text"/>
            </div>
        </div>
        <div class="flex items-center gap-2">
            <button class="hover:bg-slate-50 dark:hover:bg-slate-800 rounded-full p-2 transition-all">
                <span class="material-symbols-outlined text-slate-600 dark:text-slate-400">notifications</span>
            </button>
            <button class="hover:bg-slate-50 dark:hover:bg-slate-800 rounded-full p-2 transition-all">
                <span class="material-symbols-outlined text-slate-600 dark:text-slate-400">apps</span>
            </button>
            <div class="h-6 w-px bg-slate-200 dark:border-slate-800 mx-2"></div>
            <button class="text-slate-500 dark:text-slate-400 font-medium px-2 hover:text-slate-900">Ayuda</button>
            <div class="ml-4 flex items-center gap-3">
                <img alt="Perfil" class="w-8 h-8 rounded-full border border-slate-200" src="https://lh3.googleusercontent.com/aida-public/AB6AXuAoMxEXQjl6syd-YgitAXsmF4aMqm-umsXb5ew_cdwlF1kxOeG8LbP8QRBn5hC7xCv3QNcIFVCo8qGzthqBi1hF5AQEHd7MTmS6UaG4uvs0LKHbgb5s8W4_XTO-GtNvOmtUIHtQREFXmZwb0_MVCcCNdJbKLHyNt9vi_mVz92HLxBwNkwgBK-0Bbul9oBPakp2op3_uCSls0KjNNZqMCNgaf3SKZoBWe1LnAG_npm7BRSrCJlC92_Hy5UB9GRVbPRfMYJSPIw5XcneU"/>
            </div>
        </div>
    </header>

    <!-- Content Area -->
    <main id="main-content" class="ml-64 px-8 pb-12 min-h-screen max-w-[1440px] mx-auto">
        <!-- Content will be injected here -->
    </main>

    <script>
        // Titlebar controls
        document.getElementById('min-btn').addEventListener('click', () => {
            window.electronAPI.minimize()
        })

        document.getElementById('max-btn').addEventListener('click', () => {
            window.electronAPI.maximize()
        })

        document.getElementById('close-btn').addEventListener('click', () => {
            window.electronAPI.close()
        })

        const updateMaximizeIcon = (isMaximized) => {
            const maxIcon = document.getElementById('max-icon')
            const restoreIcon = document.getElementById('restore-icon')
            const maxBtn = document.getElementById('max-btn')
            if (isMaximized) {
                maxIcon.style.display = 'none'
                restoreIcon.style.display = 'block'
                maxBtn.title = 'Restaurar'
            } else {
                maxIcon.style.display = 'block'
                restoreIcon.style.display = 'none'
                maxBtn.title = 'Maximizar'
            }
        }
        window.electronAPI.onWindowMaximized(updateMaximizeIcon)

        // Logout
        document.getElementById('logout-btn').addEventListener('click', () => {
            window.location.href = 'index.html'
        })

        // SPA Navigation Logic
        const mainContent = document.getElementById('main-content');
        const navItems = document.querySelectorAll('.nav-item');

        async function loadPage(pageName) {
            try {
                const response = await fetch(`${pageName}_content.html`);
                const html = await response.text();
                mainContent.innerHTML = html;
                
                // Update active state in nav
                navItems.forEach(item => {
                    if (item.dataset.page === pageName) {
                        item.classList.add('bg-slate-800/50', 'text-white', 'font-semibold');
                        item.classList.remove('text-slate-400');
                    } else {
                        item.classList.remove('bg-slate-800/50', 'text-white', 'font-semibold');
                        item.classList.add('text-slate-400');
                    }
                });

                // Trigger page-specific logic
                if (pageName === 'dashboard') {
                    loadDashboard();
                } else if (pageName === 'clients') {
                    loadClients();
                    setupPaymentForm();
                } else if (pageName === 'history') {
                    loadHistory();
                } else if (pageName === 'links') {
                    loadLinks();
                }
            } catch (error) {
                console.error('Error loading page:', error);
                mainContent.innerHTML = '<h2>Error al cargar la página</h2>';
            }
        }

        // --- LINKS PAGE LOGIC ---

        async function loadLinks() {
            console.log('[Links] Iniciando carga de historial de enlaces...');
            const tbody = document.getElementById('links-table-body');
            if (!tbody) return;

            const { data, error } = await window.electronAPI.getLinks();

            if (error) {
                console.error('[Links] Error al obtener datos:', error);
                tbody.innerHTML = `<tr><td colspan="5" class="px-6 py-8 text-center text-red-500">Error: ${error.message || error}</td></tr>`;
                return;
            }

            if (!data || data.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" class="px-6 py-12 text-center text-slate-400 font-medium">No has generado ningún link todavía.</td></tr>`;
                return;
            }

            tbody.innerHTML = data.map(item => {
                const date = new Date(item.created_at).toLocaleDateString('es-ES', {
                    day: '2-digit', month: 'short', year: 'numeric'
                });
                const amount = (item.amount / 100).toLocaleString('en-US', { style: 'currency', currency: item.currency.toUpperCase() });
                
                return `
                    <tr class="hover:bg-slate-50/80 transition-colors border-b border-slate-50">
                        <td class="px-6 py-4 text-xs font-medium text-slate-500 uppercase">${date}</td>
                        <td class="px-6 py-4 text-sm font-semibold text-slate-900">${item.description || 'Sin descripción'}</td>
                        <td class="px-6 py-4 text-sm font-bold text-slate-900">${amount}</td>
                        <td class="px-6 py-4">
                            <div class="flex items-center gap-2 max-w-[200px]">
                                <span class="text-xs text-blue-600 truncate underline cursor-default">${item.url}</span>
                            </div>
                        </td>
                        <td class="px-6 py-4 text-right">
                            <div class="flex justify-end gap-2">
                                <button onclick="copyLink('${item.url}')" class="p-1.5 hover:bg-slate-100 rounded text-slate-500 hover:text-blue-600 transition-colors" title="Copiar Link">
                                    <span class="material-symbols-outlined text-lg">content_copy</span>
                                </button>
                                <button onclick="deleteLink(${item.id})" class="p-1.5 hover:bg-red-50 rounded text-slate-500 hover:text-red-600 transition-colors" title="Eliminar">
                                    <span class="material-symbols-outlined text-lg">delete</span>
                                </button>
                            </div>
                        </td>
                    </tr>
                `;
            }).join('');
        }

        window.copyLink = (url) => {
            navigator.clipboard.writeText(url).then(() => {
                alert('Link copiado al portapapeles');
            });
        }

        window.deleteLink = async (id) => {
            if (!confirm('¿Estás seguro de que quieres eliminar este link del historial? (Esto no cancela el link en Stripe)')) return;
            
            const { success, error } = await window.electronAPI.deleteLink(id);
            if (success) {
                loadLinks();
            } else {
                alert('Error al eliminar: ' + error);
            }
        }

        // --- DASHBOARD PAGE LOGIC ---

        async function loadDashboard() {
            console.log('[Dashboard] Iniciando carga de datos reales...');
            const elements = {
                revenue: document.getElementById('dash-revenue'),
                available: document.getElementById('dash-available'),
                pending: document.getElementById('dash-pending'),
                links: document.getElementById('dash-links'),
                chart: document.getElementById('dash-chart'),
                activity: document.getElementById('dash-activity')
            };

            if (!elements.revenue) return;

            try {
                // Obtener datos concurrentemente
                const [balanceRes, historyRes] = await Promise.all([
                    window.electronAPI.getBalance(),
                    window.electronAPI.getHistory()
                ]);

                if (balanceRes.error) throw new Error(balanceRes.error);
                if (historyRes.error) throw new Error(historyRes.error);

                const balance = balanceRes.data;
                const history = historyRes.data;

                // 1. Procesar Balance
                const availableAmount = (balance.available.reduce((acc, curr) => acc + curr.amount, 0)) / 100;
                const pendingAmount = (balance.pending.reduce((acc, curr) => acc + curr.amount, 0)) / 100;
                const totalRevenue = availableAmount + pendingAmount;
                const currency = balance.available[0]?.currency.toUpperCase() || 'USD';

                elements.revenue.innerText = totalRevenue.toLocaleString('en-US', { style: 'currency', currency });
                elements.available.innerText = availableAmount.toLocaleString('en-US', { style: 'currency', currency });
                elements.pending.innerText = pendingAmount.toLocaleString('en-US', { style: 'currency', currency });

                // 2. Procesar Historial (Links Exitosos y Actividad Reciente)
                const successfulPayments = history.filter(p => p.status === 'succeeded');
                elements.links.innerText = successfulPayments.length;

                // Actividad Reciente (últimos 4)
                if (history.length === 0) {
                    elements.activity.innerHTML = '<p class="text-xs text-slate-400 text-center py-4">No hay actividad reciente.</p>';
                } else {
                    elements.activity.innerHTML = history.slice(0, 4).map(item => {
                        const timeAgo = getTimeAgo(new Date(item.created_at));
                        const isSuccess = item.status === 'succeeded';
                        return `
                            <div class="flex gap-4">
                                <div class="w-10 h-10 rounded-full ${isSuccess ? 'bg-emerald-100' : 'bg-amber-100'} flex items-center justify-center shrink-0">
                                    <span class="material-symbols-outlined ${isSuccess ? 'text-emerald-600' : 'text-amber-600'} text-xl">
                                        ${isSuccess ? 'check' : 'pending'}
                                    </span>
                                </div>
                                <div class="flex-1">
                                    <p class="text-sm font-semibold text-slate-900 line-clamp-1">${item.description || 'Pago de servicio'}</p>
                                    <p class="text-xs text-slate-500">${timeAgo}</p>
                                </div>
                                <div class="text-right">
                                    <p class="text-sm font-bold text-slate-900">${(item.amount / 100).toLocaleString('en-US', { style: 'currency', currency: item.currency.toUpperCase() })}</p>
                                </div>
                            </div>
                        `;
                    }).join('');
                }

                // 3. Gráfico de Rendimiento (Últimos 10 días)
                const last10Days = Array.from({ length: 10 }, (_, i) => {
                    const d = new Date();
                    d.setDate(d.getDate() - (9 - i));
                    d.setHours(0, 0, 0, 0);
                    return d;
                });

                const dailyRevenue = last10Days.map(date => {
                    return history
                        .filter(p => p.status === 'succeeded' && new Date(p.created_at).toDateString() === date.toDateString())
                        .reduce((acc, curr) => acc + curr.amount, 0) / 100;
                });

                const maxRevenue = Math.max(...dailyRevenue, 1); // Evitar división por cero
                elements.chart.innerHTML = dailyRevenue.map((amount, i) => {
                    const height = (amount / maxRevenue) * 100;
                    const dateStr = last10Days[i].toLocaleDateString('es-ES', { day: '2-digit' });
                    return `
                        <div class="flex flex-col items-center gap-2 group relative h-full justify-end" style="width: 8%;">
                            <div class="absolute -top-8 bg-slate-900 text-white text-[10px] px-2 py-1 rounded opacity-0 group-hover:opacity-100 transition-opacity whitespace-nowrap z-10">
                                ${amount.toLocaleString('en-US', { style: 'currency', currency })}
                            </div>
                            <div class="w-full bg-blue-600 rounded-t-sm transition-all duration-500 hover:bg-blue-700" 
                                 style="height: ${Math.max(height, 5)}%"></div>
                            <span class="text-[10px] text-slate-400 font-medium">${dateStr}</span>
                        </div>
                    `;
                }).join('');

            } catch (err) {
                console.error('[Dashboard] Error cargando datos:', err);
                elements.revenue.innerHTML = '<span class="text-xs text-red-500">Error al cargar</span>';
            }
        }

        function getTimeAgo(date) {
            const seconds = Math.floor((new Date() - date) / 1000);
            let interval = seconds / 31536000;
            if (interval > 1) return `Hace ${Math.floor(interval)} años`;
            interval = seconds / 2592000;
            if (interval > 1) return `Hace ${Math.floor(interval)} meses`;
            interval = seconds / 86400;
            if (interval > 1) return `Hace ${Math.floor(interval)} días`;
            interval = seconds / 3600;
            if (interval > 1) return `Hace ${Math.floor(interval)} horas`;
            interval = seconds / 60;
            if (interval > 1) return `Hace ${Math.floor(interval)} minutos`;
            return 'Hace un momento';
        }

        // --- HISTORY PAGE LOGIC ---

        async function loadHistory() {
            console.log('[History] Iniciando carga de historial...');
            const tbody = document.getElementById('history-table-body');
            if (!tbody) return;

            const { data, error } = await window.electronAPI.getHistory();

            if (error) {
                console.error('[History] Error al obtener datos:', error);
                tbody.innerHTML = `<tr><td colspan="5" class="px-6 py-8 text-center text-red-500">Error: ${error.message || error}</td></tr>`;
                return;
            }

            console.log(`[History] Se obtuvieron ${data ? data.length : 0} registros.`);

            if (!data || data.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" class="px-6 py-12 text-center text-slate-400 font-medium">No hay registros de pago todavía.</td></tr>`;
                return;
            }

            tbody.innerHTML = data.map(item => {
                const date = new Date(item.created_at).toLocaleDateString('es-ES', {
                    day: '2-digit', month: 'short', year: 'numeric'
                });
                const amount = (item.amount / 100).toLocaleString('en-US', { style: 'currency', currency: item.currency.toUpperCase() });
                
                return `
                    <tr class="hover:bg-slate-50/80 transition-colors border-b border-slate-50">
                        <td class="px-6 py-4 text-xs font-medium text-slate-500 uppercase">${date}</td>
                        <td class="px-6 py-4">
                            <p class="text-sm font-semibold text-slate-900">${item.description || 'Pago de servicio'}</p>
                            <p class="text-[10px] text-slate-400 uppercase tracking-tighter">Stripe Charge: ${item.stripe_charge_id}</p>
                        </td>
                        <td class="px-6 py-4 text-sm font-bold text-slate-900">${amount}</td>
                        <td class="px-6 py-4">
                            <span class="inline-flex items-center px-2 py-0.5 rounded-full text-[10px] font-bold uppercase 
                                ${item.status === 'succeeded' ? 'bg-green-100 text-green-700' : 'bg-amber-100 text-amber-700'}">
                                ${item.status === 'succeeded' ? 'Completado' : item.status}
                            </span>
                        </td>
                        <td class="px-6 py-4 text-right text-[10px] font-mono text-slate-400">
                            #${item.stripe_charge_id.slice(-8).toUpperCase()}
                        </td>
                    </tr>
                `;
            }).join('');
        }

        // --- CLIENTS PAGE LOGIC ---

        async function loadClients() {
            console.log('[Clients] Iniciando carga de clientes...');
            const tbody = document.getElementById('clients-table-body');
            const statActive = document.getElementById('stat-active-clients');
            if (!tbody) return;

            const { data, error } = await window.electronAPI.getClients();

            if (error) {
                console.error('[Clients] Error al obtener datos:', error);
                tbody.innerHTML = `<tr><td colspan="4" class="px-6 py-8 text-center text-red-500">Error: ${error.message || error}</td></tr>`;
                return;
            }

            console.log(`[Clients] Se obtuvieron ${data ? data.length : 0} clientes.`);

            if (!data || data.length === 0) {
                tbody.innerHTML = `<tr><td colspan="4" class="px-6 py-12 text-center text-slate-400 font-medium">No hay clientes en la base de datos.<br><span class="text-xs font-normal">Sincronizá con Stripe para empezar.</span></td></tr>`;
                if (statActive) statActive.innerText = '0';
                return;
            }

            if (statActive) statActive.innerText = data.length;
            
            tbody.innerHTML = data.map(client => `
                <tr class="hover:bg-slate-50/80 transition-colors group border-b border-slate-50">
                    <td class="px-6 py-4">
                        <div class="flex items-center gap-3">
                            <div class="w-9 h-9 rounded-full bg-blue-100 flex items-center justify-center text-blue-700 font-bold text-xs">
                                ${client.name ? client.name.substring(0, 2).toUpperCase() : '??'}
                            </div>
                            <div>
                                <p class="font-headline-sm text-sm text-slate-900 mb-0.5">${client.name || 'Sin nombre'}</p>
                                <p class="text-[10px] text-slate-400 font-mono">${client.stripe_customer_id || 'ID pendiente'}</p>
                            </div>
                        </div>
                    </td>
                    <td class="px-6 py-4 text-sm text-slate-600 text-right">
                        <div class="flex flex-col items-end">
                            <span class="font-mono text-xs">${client.email}</span>
                            <span class="text-[10px] text-slate-400 mt-0.5 flex items-center gap-1">
                                <span class="material-symbols-outlined text-[12px]">credit_card</span>
                                ${client.payment_method || 'Sin método'}
                            </span>
                        </div>
                    </td>
                    <td class="px-6 py-4">
                        ${client.status === 'active' 
                            ? `<div class="flex flex-col gap-1">
                                <span class="inline-flex items-center px-2 py-0.5 rounded-full text-[10px] font-bold bg-green-100 text-green-700 uppercase tracking-wider w-fit">
                                    <span class="w-1 h-1 rounded-full bg-green-500 mr-1.5"></span>
                                    Suscripción Activa
                                </span>
                                <span class="text-[9px] text-slate-400 font-medium ml-1">Autorenovable</span>
                               </div>`
                            : `<div class="flex flex-col gap-1">
                                <span class="inline-flex items-center px-2 py-0.5 rounded-full text-[10px] font-bold bg-slate-100 text-slate-500 uppercase tracking-wider w-fit">
                                    Sin Suscripción
                                </span>
                                <span class="text-[9px] text-slate-400 font-medium ml-1">Pago único o pendiente</span>
                               </div>`
                        }
                    </td>
                    <td class="px-6 py-4 text-right">
                        <div class="flex items-center justify-end gap-2">
                            <div class="inline-flex items-center gap-1 px-2 py-0.5 bg-green-50 text-green-700 rounded text-[9px] font-bold border border-green-100">
                                <span class="w-1 h-1 rounded-full bg-green-500 animate-pulse"></span>
                                SYNC
                            </div>
                            <button onclick="openPaymentModal('${client.email}', '${client.name || ''}')" 
                                    class="px-3 py-1.5 bg-blue-600 text-white hover:bg-blue-700 rounded-lg text-xs font-bold transition-all inline-flex items-center gap-1 shadow-sm">
                                <span class="material-symbols-outlined text-[14px]">payments</span>
                                Cobrar
                            </button>
                        </div>
                    </td>
                </tr>
            `).join('');
        }

        function setupPaymentForm() {
            const form = document.getElementById('payment-form');
            const typeSelect = document.getElementById('payment-type');
            const intervalGroup = document.getElementById('interval-group');
            if (!form) return;

            typeSelect.onchange = () => {
                intervalGroup.style.display = typeSelect.value === 'subscription' ? 'block' : 'none';
            };

            form.onsubmit = async (e) => {
                e.preventDefault();
                const btn = document.getElementById('gen-btn');
                const resultDiv = document.getElementById('payment-result');
                
                const payload = {
                    description: document.getElementById('payment-description').value,
                    amount: Math.round(parseFloat(document.getElementById('payment-amount').value) * 100),
                    type: typeSelect.value,
                    interval: typeSelect.value === 'subscription' ? document.getElementById('payment-interval').value : null
                };

                console.log('[Stripe] Generando link simplificado con payload:', payload);

                btn.disabled = true;
                btn.innerHTML = '<span class="material-symbols-outlined animate-spin">refresh</span> Generando...';

                const { data, error } = await window.electronAPI.createPaymentLink(payload);

                btn.disabled = false;
                btn.innerHTML = '<span class="material-symbols-outlined text-[18px]">link</span> Crear Link de Pago';

                if (error) {
                    console.error('[Stripe] Error en respuesta:', error);
                    alert('Error: ' + (error.error || error.message || 'No se pudo generar el link'));
                    return;
                }

                console.log('[Stripe] Link generado exitosamente:', data.url);
                resultDiv.innerHTML = `Link de Stripe (copialo y mandalo):<br><a href="${data.url}" target="_blank" class="text-blue-600 underline break-all">${data.url}</a>`;
                resultDiv.classList.remove('hidden');
            };
        }

        window.openPaymentModal = (email, name) => {
            console.log(`[UI] Abriendo modal simplificado`);
            const modal = document.getElementById('payment-modal');
            
            // Si venimos de un cliente específico, pre-cargamos el concepto
            if (name) {
                document.getElementById('payment-description').value = `Pago de ${name}`;
            } else {
                document.getElementById('payment-description').value = '';
            }

            modal.classList.remove('hidden');
            document.getElementById('payment-result').classList.add('hidden');
        }

        window.closePaymentModal = () => {
            console.log('[UI] Cerrando modal de pago.');
            document.getElementById('payment-modal').classList.add('hidden');
            document.getElementById('payment-form').reset();
        }

        window.openPaymentModalFromDashboard = async () => {
            console.log('[Dashboard] Botón generar link clickeado.');
            await loadPage('clients');
            openPaymentModal('', '');
        }

        window.syncStripeData = async () => {
            if (!confirm('¿Quieres sincronizar los clientes desde Stripe?')) return;
            console.log('[Sync] Iniciando sincronización manual...');
            const btn = document.querySelector('button[onclick="syncStripeData()"]');
            if (!btn) return;
            const originalText = btn.innerHTML;
            
            btn.disabled = true;
            btn.innerHTML = '<span class="material-symbols-outlined animate-spin">refresh</span> Sincronizando...';
            
            const { data, error } = await window.electronAPI.syncStripeCustomers();
            
            btn.disabled = false;
            btn.innerHTML = originalText;
            
            if (error) {
                console.error('[Sync] Error:', error);
                alert('Error al sincronizar: ' + (error.message || error));
            } else {
                console.log('[Sync] Éxito:', data);
                alert('Sincronización completada con éxito.');
                loadClients();
            }
        }

        // Handle navigation clicks
        navItems.forEach(item => {
            item.addEventListener('click', () => {
                loadPage(item.dataset.page);
            });
        });

        // Load default page
        window.addEventListener('DOMContentLoaded', () => {
            loadPage('dashboard');
        });
    </script>
</body>
</html>
