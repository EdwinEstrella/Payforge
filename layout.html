<!DOCTYPE html>
<html class="light" lang="es">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Payforge - Panel de Control</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "surface-dim": "#dcd9db",
                        "outline": "#76777d",
                        "inverse-on-surface": "#f3f0f2",
                        "tertiary-fixed-dim": "#c4c7c9",
                        "surface-variant": "#e4e2e4",
                        "on-secondary-container": "#54647a",
                        "on-secondary": "#ffffff",
                        "tertiary-container": "#191c1e",
                        "surface-tint": "#565e74",
                        "surface-container": "#f0edef",
                        "error": "#ba1a1a",
                        "on-primary-fixed": "#131b2e",
                        "secondary-container": "#d0e1fb",
                        "primary": "#000000",
                        "on-tertiary-fixed": "#191c1e",
                        "secondary-fixed-dim": "#b7c8e1",
                        "primary-container": "#131b2e",
                        "on-secondary-fixed-variant": "#38485d",
                        "error-container": "#ffdad6",
                        "surface-container-low": "#f6f3f5",
                        "secondary": "#505f76",
                        "background": "#fcf8fa",
                        "tertiary": "#000000",
                        "on-secondary-fixed": "#0b1c30",
                        "on-tertiary-container": "#818486",
                        "on-surface-variant": "#45464d",
                        "on-tertiary-fixed-variant": "#444749",
                        "tertiary-fixed": "#e0e3e5",
                        "surface-container-high": "#eae7e9",
                        "on-background": "#1b1b1d",
                        "surface-bright": "#fcf8fa",
                        "inverse-surface": "#303032",
                        "inverse-primary": "#bec6e0",
                        "on-error-container": "#93000a",
                        "on-tertiary": "#ffffff",
                        "surface": "#fcf8fa",
                        "primary-fixed-dim": "#bec6e0",
                        "surface-container-highest": "#e4e2e4",
                        "on-surface": "#1b1b1d",
                        "surface-container-lowest": "#ffffff",
                        "on-primary-fixed-variant": "#3f465c",
                        "outline-variant": "#c6c6cd",
                        "primary-fixed": "#dae2fd",
                        "on-error": "#ffffff",
                        "secondary-fixed": "#d3e4fe",
                        "on-primary": "#ffffff",
                        "on-primary-container": "#7c839b"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.125rem",
                        "lg": "0.25rem",
                        "xl": "0.5rem",
                        "full": "0.75rem"
                    },
                    "spacing": {
                        "sidebar-width": "260px",
                        "xs": "4px",
                        "xl": "40px",
                        "sm": "8px",
                        "lg": "24px",
                        "md": "16px",
                        "base": "4px",
                        "container-max": "1440px"
                    },
                    "fontFamily": {
                        "headline-sm": ["Manrope", "sans-serif"],
                        "body-md": ["Inter", "sans-serif"],
                        "headline-md": ["Manrope", "sans-serif"],
                        "display-lg": ["Manrope", "sans-serif"],
                        "label-caps": ["Inter", "sans-serif"],
                        "body-lg": ["Inter", "sans-serif"],
                        "data-mono": ["Inter", "sans-serif"]
                    },
                    "fontSize": {
                        "headline-sm": ["20px", { "lineHeight": "28px", "fontWeight": "600" }],
                        "body-md": ["14px", { "lineHeight": "20px", "fontWeight": "400" }],
                        "headline-md": ["24px", { "lineHeight": "32px", "letterSpacing": "-0.01em", "fontWeight": "600" }],
                        "display-lg": ["36px", { "lineHeight": "44px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "label-caps": ["12px", { "lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "600" }],
                        "body-lg": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "data-mono": ["14px", { "lineHeight": "20px", "letterSpacing": "0.01em", "fontWeight": "500" }]
                    }
                }
            }
        }
    </script>
    <style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        body {
            background-color: #fcf8fa;
        }
        /* Custom Titlebar for Electron */
        .titlebar {
            -webkit-app-region: drag;
            height: 32px;
            background-color: #f5f5f5;
            border-bottom: 1px solid #e0e0e0;
            display: flex;
            align-items: center;
            padding: 0 12px;
            user-select: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 9999;
        }
        .titlebar-title {
            font-size: 12px;
            font-weight: 500;
            color: #333;
            flex-grow: 1;
        }
        .titlebar-controls {
            -webkit-app-region: no-drag;
            display: flex;
            gap: 0;
            margin-left: auto;
        }
        .titlebar-btn {
            width: 46px;
            height: 32px;
            border: none;
            background: transparent;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #333;
            transition: background-color 0.15s ease;
        }
        .titlebar-btn:hover {
            background-color: rgba(0, 0, 0, 0.05);
        }
        .titlebar-btn.close:hover {
            background-color: #e81123;
            color: white;
        }
        .titlebar-btn svg {
            width: 12px;
            height: 12px;
            stroke: currentColor;
            fill: none;
            stroke-width: 1.5;
        }
        /* Adjust layout for titlebar */
        aside, header {
            top: 32px !important;
            height: calc(100% - 32px) !important;
        }
        header {
            height: 64px !important;
        }
        #main-content {
            padding-top: calc(64px + 32px + 24px) !important;
        }
    </style>
</head>
<body class="font-body-md text-on-surface antialiased">
    <!-- Custom Titlebar -->
    <div class="titlebar">
        <div class="titlebar-title">Payforge - Sistema de Gestión</div>
        <div class="titlebar-controls">
            <button class="titlebar-btn" id="min-btn" title="Minimizar">
                <svg viewBox="0 0 12 12"><rect x="1" y="5" width="10" height="1"/></svg>
            </button>
            <button class="titlebar-btn" id="max-btn" title="Maximizar">
                <svg id="max-icon" viewBox="0 0 12 12"><rect x="1" y="1" width="10" height="10"/></svg>
                <svg id="restore-icon" viewBox="0 0 12 12" style="display: none;">
                    <rect x="1" y="3" width="8" height="8"/>
                    <polyline points="3 3 3 1 11 1 11 9" fill="none"/>
                </svg>
            </button>
            <button class="titlebar-btn close" id="close-btn" title="Cerrar">
                <svg viewBox="0 0 12 12"><path d="M1 1L11 11M11 1L1 11"/></svg>
            </button>
        </div>
    </div>

    <!-- SideNavBar -->
    <aside class="fixed left-0 w-64 border-r border-slate-800 bg-slate-950 dark:bg-black font-manrope antialiased tracking-tight flex flex-col p-4 z-50">
        <div class="mb-8 px-4 flex items-center gap-3">
            <div class="w-10 h-10 flex items-center justify-center">
                <img src="logo_blanco_negro.png" alt="Logo" class="w-full h-full object-contain filter invert" />
            </div>
            <div>
                <h1 class="text-white text-xl font-bold tracking-tight">Payforge</h1>
            </div>
        </div>
        <nav class="flex-1 space-y-1" id="nav-links">
            <a data-page="dashboard" class="nav-item flex items-center gap-3 px-4 py-3 bg-slate-800/50 text-white rounded-lg font-semibold cursor-pointer active:scale-[0.98] transition-transform duration-150">
                <span class="material-symbols-outlined">dashboard</span>
                Panel Principal
            </a>
            <a data-page="clients" class="nav-item flex items-center gap-3 px-4 py-3 text-slate-400 hover:text-white cursor-pointer transition-colors active:scale-[0.98] transition-transform duration-150">
                <span class="material-symbols-outlined">group</span>
                Clientes
            </a>
            <a data-page="history" class="nav-item flex items-center gap-3 px-4 py-3 text-slate-400 hover:text-white cursor-pointer transition-colors active:scale-[0.98] transition-transform duration-150">
                <span class="material-symbols-outlined">history</span>
                Historial
            </a>
        </nav>
        <div class="mt-auto space-y-1 border-t border-slate-800 pt-4">
            <a class="flex items-center gap-3 px-4 py-3 text-slate-400 hover:text-white transition-colors cursor-pointer">
                <span class="material-symbols-outlined">settings</span>
                Configuración
            </a>
            <a class="flex items-center gap-3 px-4 py-3 text-slate-400 hover:text-white transition-colors cursor-pointer">
                <span class="material-symbols-outlined">help</span>
                Soporte
            </a>
            <div class="mt-4 px-4">
                <button id="logout-btn" class="w-full py-2.5 bg-slate-800 hover:bg-red-600 text-white rounded-lg font-semibold text-sm transition-all active:scale-95 flex items-center justify-center gap-2">
                    <span class="material-symbols-outlined text-sm">logout</span>
                    Cerrar Sesión
                </button>
            </div>
        </div>
    </aside>

    <!-- TopAppBar -->
    <header class="fixed right-0 w-[calc(100%-16rem)] border-b border-slate-200 dark:border-slate-800 bg-white/80 dark:bg-slate-900/80 backdrop-blur-md flex items-center justify-between px-8 z-40 font-manrope text-sm font-medium">
        <div class="flex items-center gap-4 flex-1">
            <div class="relative w-full max-w-md">
                <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-lg">search</span>
                <input class="w-full pl-10 pr-4 py-2 bg-slate-50 dark:bg-slate-800 border-none rounded-full text-sm focus:ring-2 focus:ring-blue-500/20 transition-all" placeholder="Buscar..." type="text"/>
            </div>
        </div>
        <div class="flex items-center gap-2">
            <button class="hover:bg-slate-50 dark:hover:bg-slate-800 rounded-full p-2 transition-all">
                <span class="material-symbols-outlined text-slate-600 dark:text-slate-400">notifications</span>
            </button>
            <button class="hover:bg-slate-50 dark:hover:bg-slate-800 rounded-full p-2 transition-all">
                <span class="material-symbols-outlined text-slate-600 dark:text-slate-400">apps</span>
            </button>
            <div class="h-6 w-px bg-slate-200 dark:border-slate-800 mx-2"></div>
            <button class="text-slate-500 dark:text-slate-400 font-medium px-2 hover:text-slate-900">Ayuda</button>
            <div class="ml-4 flex items-center gap-3">
                <img alt="Perfil" class="w-8 h-8 rounded-full border border-slate-200" src="https://lh3.googleusercontent.com/aida-public/AB6AXuAoMxEXQjl6syd-YgitAXsmF4aMqm-umsXb5ew_cdwlF1kxOeG8LbP8QRBn5hC7xCv3QNcIFVCo8qGzthqBi1hF5AQEHd7MTmS6UaG4uvs0LKHbgb5s8W4_XTO-GtNvOmtUIHtQREFXmZwb0_MVCcCNdJbKLHyNt9vi_mVz92HLxBwNkwgBK-0Bbul9oBPakp2op3_uCSls0KjNNZqMCNgaf3SKZoBWe1LnAG_npm7BRSrCJlC92_Hy5UB9GRVbPRfMYJSPIw5XcneU"/>
            </div>
        </div>
    </header>

    <!-- Content Area -->
    <main id="main-content" class="ml-64 px-8 pb-12 min-h-screen max-w-[1440px] mx-auto">
        <!-- Content will be injected here -->
    </main>

    <script>
        // Titlebar controls
        document.getElementById('min-btn').addEventListener('click', () => {
            window.electronAPI.minimize()
        })

        document.getElementById('max-btn').addEventListener('click', () => {
            window.electronAPI.maximize()
        })

        document.getElementById('close-btn').addEventListener('click', () => {
            window.electronAPI.close()
        })

        const updateMaximizeIcon = (isMaximized) => {
            const maxIcon = document.getElementById('max-icon')
            const restoreIcon = document.getElementById('restore-icon')
            const maxBtn = document.getElementById('max-btn')
            if (isMaximized) {
                maxIcon.style.display = 'none'
                restoreIcon.style.display = 'block'
                maxBtn.title = 'Restaurar'
            } else {
                maxIcon.style.display = 'block'
                restoreIcon.style.display = 'none'
                maxBtn.title = 'Maximizar'
            }
        }
        window.electronAPI.onWindowMaximized(updateMaximizeIcon)

        // Logout
        document.getElementById('logout-btn').addEventListener('click', () => {
            window.location.href = 'index.html'
        })

        // SPA Navigation Logic
        const mainContent = document.getElementById('main-content');
        const navItems = document.querySelectorAll('.nav-item');

        async function loadPage(pageName) {
            try {
                const response = await fetch(`${pageName}_content.html`);
                const html = await response.text();
                mainContent.innerHTML = html;
                
                // Update active state in nav
                navItems.forEach(item => {
                    if (item.dataset.page === pageName) {
                        item.classList.add('bg-slate-800/50', 'text-white', 'font-semibold');
                        item.classList.remove('text-slate-400');
                    } else {
                        item.classList.remove('bg-slate-800/50', 'text-white', 'font-semibold');
                        item.classList.add('text-slate-400');
                    }
                });

                // Re-initialize page-specific scripts if any
                if (pageName === 'dashboard') {
                    // Dashboard specific logic can go here
                }
            } catch (error) {
                console.error('Error loading page:', error);
                mainContent.innerHTML = '<h2>Error al cargar la página</h2>';
            }
        }

        // Handle navigation clicks
        navItems.forEach(item => {
            item.addEventListener('click', () => {
                loadPage(item.dataset.page);
            });
        });

        // Load default page
        window.addEventListener('DOMContentLoaded', () => {
            loadPage('dashboard');
        });
    </script>
</body>
</html>
