        const updateMaximizeIcon = (isMaximized) => {
            const maxIcon = document.getElementById('max-icon')
            const restoreIcon = document.getElementById('restore-icon')
            const maxBtn = document.getElementById('max-btn')
            if (isMaximized) {
                maxIcon.style.display = 'none'
                restoreIcon.style.display = 'block'
                maxBtn.title = 'Restaurar'
            } else {
                maxIcon.style.display = 'block'
                restoreIcon.style.display = 'none'
                maxBtn.title = 'Maximizar'
            }
        }
        window.electronAPI.onWindowMaximized(updateMaximizeIcon)

        // Logout
        document.getElementById('logout-btn').addEventListener('click', () => {
            window.location.href = 'index.html'
        })

        // --- CALENDAR PAGE LOGIC ---

        let currentCalendarDate = new Date();
        let calendarEvents = [];

        async function loadCalendar() {
            console.log('[Calendar] Cargando eventos...');
            const { data, error } = await window.electronAPI.getCalendarEvents();
            if (error) {
                console.error('Error loading calendar events:', error);
                return;
            }
            calendarEvents = data;
            renderCalendar();
        }

        window.changeMonth = (delta) => {
            currentCalendarDate.setMonth(currentCalendarDate.getMonth() + delta);
            renderCalendar();
        };

        function renderCalendar() {
            const grid = document.getElementById('calendar-grid');
            const monthYearLabel = document.getElementById('calendar-month-year');
            if (!grid || !monthYearLabel) return;

            const year = currentCalendarDate.getFullYear();
            const month = currentCalendarDate.getMonth();

            const months = ['Enero', 'Febrero', 'Marzo', 'Abril', 'Mayo', 'Junio', 'Julio', 'Agosto', 'Septiembre', 'Octubre', 'Noviembre', 'Diciembre'];
            monthYearLabel.innerText = `${months[month]} ${year}`;

            const firstDay = new Date(year, month, 1).getDay();
            const daysInMonth = new Date(year, month + 1, 0).getDate();

            grid.innerHTML = '';

            // Empty days at start
            for (let i = 0; i < firstDay; i++) {
                grid.innerHTML += `<div class="border-r border-b border-slate-50 bg-slate-50/20"></div>`;
            }

            // Days of month
            for (let day = 1; day <= daysInMonth; day++) {
                const dateStr = new Date(year, month, day).toDateString();
                const dayEvents = calendarEvents.filter(e => new Date(e.date).toDateString() === dateStr);

                const isToday = new Date().toDateString() === dateStr;

                grid.innerHTML += `
                    <div class="border-r border-b border-slate-100 p-2 space-y-1 overflow-y-auto hover:bg-slate-50 transition-colors">
                        <span class="text-xs font-bold ${isToday ? 'bg-black text-white w-6 h-6 flex items-center justify-center rounded-full' : 'text-slate-400'}">
                            ${day}
                        </span>
                        <div class="space-y-1">
                            ${dayEvents.map(e => {
                                const typeColors = {
                                    'contract-created': 'bg-blue-500',
                                    'contract-signed': 'bg-green-500',
                                    'contract-expiry': 'bg-red-500',
                                    'proposal-created': 'bg-purple-500',
                                    'proposal-expiry': 'bg-amber-500'
                                };
                                return `
                                    <div class="px-1.5 py-0.5 rounded text-[9px] font-bold text-white truncate shadow-sm ${typeColors[e.type] || 'bg-slate-500'}" title="${e.title}">
                                        ${e.title}
                                    </div>
                                `;
                            }).join('')}
                        </div>
                    </div>
                `;
            }
        }

        // --- SPA Navigation Logic ---
        const mainContent = document.getElementById('main-content');
        const navItems = document.querySelectorAll('.nav-item');

        async function loadPage(pageName) {
            try {
                const contentPageName = pageName === 'contracts-active' ? 'contracts' : pageName;
                const response = await fetch(`${contentPageName}_content.html`);
                const html = await response.text();
                mainContent.innerHTML = html;
                
                // Update active state in nav
                navItems.forEach(item => {
                    if (item.dataset.page === pageName) {
                        item.classList.add('bg-slate-800/50', 'text-white', 'font-semibold');
                        item.classList.remove('text-slate-400');
                    } else {
                        item.classList.remove('bg-slate-800/50', 'text-white', 'font-semibold');
                        item.classList.add('text-slate-400');
                    }
                });

                // Trigger page-specific logic
                if (pageName === 'dashboard') {
                    loadDashboard();
                } else if (pageName === 'clients') {
                    loadClients();
                    setupPaymentForm();
                } else if (pageName === 'history') {
                    loadHistory();
                } else if (pageName === 'links') {
                    loadLinks();
                } else if (pageName === 'proposals') {
                    loadProposals();
                } else if (pageName === 'contracts') {
                    loadContracts(false);
                } else if (pageName === 'contracts-active') {
                    loadContracts(true);
                } else if (pageName === 'calendar') {
                    loadCalendar();
                }
            } catch (error) {
                console.error('Error loading page:', error);
                mainContent.innerHTML = '<h2>Error al cargar la página</h2>';
            }

        let availableProposalsForContract = [];
        let currentContractsData = [];

        function getContractPaymentActions(contract) {
            const amount = Number(contract.amount || 0);
            const recurring = Number(contract.recurring_amount || 0);
            const scheme = contract.payment_scheme || '50-50';
            const actions = [];

            if (scheme === '3-parts') {
                actions.push({ label: '30% Inicio', amount: amount * 0.3, mode: 'payment' });
                actions.push({ label: '40% Hito', amount: amount * 0.4, mode: 'payment' });
                actions.push({ label: '30% Final', amount: amount * 0.3, mode: 'payment' });
            } else if (scheme === '100-upfront') {
                actions.push({ label: '100% Pago', amount, mode: 'payment' });
            } else {
                actions.push({ label: '50% Anticipo', amount: amount * 0.5, mode: 'payment' });
                actions.push({ label: '50% Saldo', amount: amount * 0.5, mode: 'payment' });
            }

            if (recurring > 0) {
                actions.push({ label: 'Suscripcion mensual', amount: recurring, mode: 'subscription' });
            }

            return actions;
        }

                    paymentDetails = `1. **30% Inicio:** USD ${(amount * 0.3).toLocaleString('en-US', { minimumFractionDigits: 2 })}\n2. **40% Hito Intermedio:** USD ${(amount * 0.4).toLocaleString('en-US', { minimumFractionDigits: 2 })}\n3. **30% Entrega Final:** USD ${(amount * 0.3).toLocaleString('en-US', { minimumFractionDigits: 2 })}`;
                } else {
                    paymentDetails = `1. **100% Pago Único:** USD ${amount.toLocaleString('en-US', { minimumFractionDigits: 2 })} (Pago por adelantado)`;
                }

                // 3. Recurrentes
                const recurring = parseFloat(document.getElementById('recurring-amount').value) || 0;
                const recurringSection = recurring > 0 ? `**3.3 Costos Recurrentes:** Se establece un cargo mensual de **USD ${recurring.toLocaleString('en-US', { minimumFractionDigits: 2 })}** por concepto de mantenimiento, hosting y soporte técnico.` : '';

                // 4. Armar el Contrato con el Master Template
                const clientSelect = document.getElementById('contract-client');
                const selected = clientSelect.options[clientSelect.selectedIndex];
                const clientName = isManualClient ? document.getElementById('manual-client-name').value : (selected?.dataset.name || 'Cliente');
                const clientEmail = isManualClient ? document.getElementById('manual-client-email').value : (selected?.dataset.email || 'Email');
                const projectName = document.getElementById('contract-project').value;
                const devTimeValue = document.getElementById('dev-time-value').value;
                const devTimeUnit = document.getElementById('dev-time-unit').value;
                const devTime = `${devTimeValue} ${devTimeUnit}`;

                const months = ['Enero', 'Febrero', 'Marzo', 'Abril', 'Mayo', 'Junio', 'Julio', 'Agosto', 'Septiembre', 'Octubre', 'Noviembre', 'Diciembre'];
                const now = new Date();
                const dateFull = `${now.getDate()} de ${months[now.getMonth()]} del ${now.getFullYear()}`;

                const selectedProposal = availableProposalsForContract.find(p => p.id === document.getElementById('contract-proposal').value);
                const proposalAnnex = selectedProposal?.proposal_text
                    ? `\n\n---\n\n## ANEXO DE PROPUESTA TECNICA\n${selectedProposal.proposal_text}`
                    : '';

                const finalTerms = MASTER_CONTRACT_TEMPLATE
                    .replace(/{{CONTRACT_TYPE}}/g, document.getElementById('contract-type').value)
                    .replace(/{{PROJECT_NAME}}/g, projectName)
                    .replace(/{{CLIENT_NAME}}/g, clientName)
                    .replace(/{{CLIENT_EMAIL}}/g, clientEmail)
                    .replace(/{{INCLUSIONS_LIST}}/g, inclusionsText)
                    .replace(/{{DEV_TIME}}/g, devTime)
                    .replace(/{{TOTAL_AMOUNT}}/g, amount.toLocaleString('en-US', { minimumFractionDigits: 2 }))
                    .replace(/{{PAYMENT_DETAILS}}/g, paymentDetails)
                    .replace(/{{RECURRING_SECTION}}/g, recurringSection)
                    .replace(/{{DATE_FULL}}/g, dateFull) + proposalAnnex;

                const payload = {
                    description: projectName,
                    amount: amount,
                    terms: finalTerms,
                    payment_scheme: scheme,
                    recurring_amount: recurring,
                    proposal_id: document.getElementById('contract-proposal').value || null
                };

                if (isManualClient) {
                    payload.client_name = clientName;
                    payload.client_email = clientEmail;
                } else {
                    payload.client_id = clientSelect.value;
                }

                const { data, error } = await window.electronAPI.createContract(payload);
                
                btn.disabled = false;
                btn.innerText = 'Generar y Enviar Link';

                if (data) {
                    const url = `https://payforge.azokia.com/api/storage/buckets/portal-firmas/objects/index.html?token=${data.token}`;

            document.querySelectorAll('.proposal-stack-checkbox:checked').forEach(input => {

                if (category === 'framework') selected.frameworks.push(input.value);

        async function loadDashboard() {
            console.log('[Dashboard] Iniciando carga de datos reales...');
            const elements = {
                revenue: document.getElementById('dash-revenue'),
                available: document.getElementById('dash-available'),
                pending: document.getElementById('dash-pending'),
                links: document.getElementById('dash-links'),
                chart: document.getElementById('dash-chart'),
                activity: document.getElementById('dash-activity')
            };

            if (!elements.revenue) return;

            try {
                // Obtener datos concurrentemente
                const [balanceRes, historyRes] = await Promise.all([
                    window.electronAPI.getBalance(),
                    window.electronAPI.getHistory()
                ]);

                if (balanceRes.error) throw new Error(balanceRes.error);
                if (historyRes.error) throw new Error(historyRes.error);

                const balance = balanceRes.data;
                const history = historyRes.data;

                // 1. Procesar Balance
                const availableAmount = (balance.available.reduce((acc, curr) => acc + curr.amount, 0)) / 100;
                const pendingAmount = (balance.pending.reduce((acc, curr) => acc + curr.amount, 0)) / 100;
                const totalRevenue = availableAmount + pendingAmount;
                const currency = balance.available[0]?.currency.toUpperCase() || 'USD';

                elements.revenue.innerText = totalRevenue.toLocaleString('en-US', { style: 'currency', currency });
                elements.available.innerText = availableAmount.toLocaleString('en-US', { style: 'currency', currency });
                elements.pending.innerText = pendingAmount.toLocaleString('en-US', { style: 'currency', currency });

                // 2. Procesar Historial (Links Exitosos y Actividad Reciente)
                const successfulPayments = history.filter(p => p.status === 'succeeded');
                elements.links.innerText = successfulPayments.length;

                // Actividad Reciente (últimos 4)
                if (history.length === 0) {
                    elements.activity.innerHTML = '<p class="text-xs text-slate-400 text-center py-4">No hay actividad reciente.</p>';
                } else {
                    elements.activity.innerHTML = history.slice(0, 5).map(item => {
                        const timeAgo = getTimeAgo(new Date(item.created_at));
                        const statusConfig = {
                            succeeded: { bg: 'bg-emerald-100', text: 'text-emerald-600', icon: 'check_circle' },
                            failed: { bg: 'bg-red-100', text: 'text-red-600', icon: 'error' },
                            expired: { bg: 'bg-slate-100', text: 'text-slate-500', icon: 'schedule' },
                            refunded: { bg: 'bg-amber-100', text: 'text-amber-600', icon: 'undo' }
                        };
                        const cfg = statusConfig[item.status] || statusConfig.failed;
                        return `
                            <div class="flex gap-4">
                                <div class="w-10 h-10 rounded-full ${cfg.bg} flex items-center justify-center shrink-0">
                                    <span class="material-symbols-outlined ${cfg.text} text-xl">${cfg.icon}</span>
                                </div>
                                <div class="flex-1">
                                    <p class="text-sm font-semibold text-slate-900 line-clamp-1">${item.description || 'Pago de servicio'}</p>
                                    <p class="text-xs text-slate-500">${timeAgo}</p>
                                    ${item.failure_reason ? `<p class="text-[10px] text-red-500 mt-0.5 line-clamp-1">${item.failure_reason}</p>` : ''}
                                </div>
                                <div class="text-right">
                                    <p class="text-sm font-bold text-slate-900">${(item.amount / 100).toLocaleString('en-US', { style: 'currency', currency: item.currency.toUpperCase() })}</p>
                                </div>
                            </div>
                        `;
                    }).join('');
                }

                // 3. Gráfico de Rendimiento (Últimos 10 días)
                const last10Days = Array.from({ length: 10 }, (_, i) => {
                    const d = new Date();
                    d.setDate(d.getDate() - (9 - i));
                    d.setHours(0, 0, 0, 0);
                    return d;
                });

                const dailyRevenue = last10Days.map(date => {
                    return history
                        .filter(p => p.status === 'succeeded' && new Date(p.created_at).toDateString() === date.toDateString())
                        .reduce((acc, curr) => acc + curr.amount, 0) / 100;
                });

                const maxRevenue = Math.max(...dailyRevenue, 1); // Evitar división por cero
                elements.chart.innerHTML = dailyRevenue.map((amount, i) => {
                    const height = (amount / maxRevenue) * 100;
                    const dateStr = last10Days[i].toLocaleDateString('es-ES', { day: '2-digit' });
                    return `
                        <div class="flex flex-col items-center gap-2 group relative h-full justify-end" style="width: 8%;">
                            <div class="absolute -top-8 bg-slate-900 text-white text-[10px] px-2 py-1 rounded opacity-0 group-hover:opacity-100 transition-opacity whitespace-nowrap z-10">
                                ${amount.toLocaleString('en-US', { style: 'currency', currency })}
                            </div>
                            <div class="w-full bg-blue-600 rounded-t-sm transition-all duration-500 hover:bg-blue-700" 
                                 style="height: ${Math.max(height, 5)}%"></div>
                            <span class="text-[10px] text-slate-400 font-medium">${dateStr}</span>
                        </div>
                    `;
                }).join('');

            } catch (err) {
                console.error('[Dashboard] Error cargando datos:', err);
                elements.revenue.innerHTML = '<span class="text-xs text-red-500">Error al cargar</span>';
            }
        }

        function getTimeAgo(date) {
            const seconds = Math.floor((new Date() - date) / 1000);
            let interval = seconds / 31536000;
            if (interval > 1) return `Hace ${Math.floor(interval)} años`;
            interval = seconds / 2592000;
            if (interval > 1) return `Hace ${Math.floor(interval)} meses`;
            interval = seconds / 86400;
            if (interval > 1) return `Hace ${Math.floor(interval)} días`;
            interval = seconds / 3600;
            if (interval > 1) return `Hace ${Math.floor(interval)} horas`;
            interval = seconds / 60;
            if (interval > 1) return `Hace ${Math.floor(interval)} minutos`;
            return 'Hace un momento';
        }

        function setupPaymentForm() {

            typeSelect.onchange = () => {
                intervalGroup.style.display = typeSelect.value === 'subscription' ? 'block' : 'none';
            };

            form.onsubmit = async (e) => {
                e.preventDefault();
                const btn = document.getElementById('gen-btn');

                const payload = {
                    description: document.getElementById('payment-description').value,
                    amount: Math.round(parseFloat(document.getElementById('payment-amount').value) * 100),
                    type: typeSelect.value,
                    interval: typeSelect.value === 'subscription' ? document.getElementById('payment-interval').value : null
                };

                console.log('[Stripe] Generando link simplificado con payload:', payload);

                btn.disabled = true;
                btn.innerHTML = '<span class="material-symbols-outlined animate-spin">refresh</span> Generando...';

                const { data, error } = await window.electronAPI.createPaymentLink(payload);

                btn.disabled = false;
                btn.innerHTML = '<span class="material-symbols-outlined text-[18px]">link</span> Crear Link de Pago';

                if (error) {
                    console.error('[Stripe] Error en respuesta:', error);
                    alert('Error: ' + (error.error || error.message || 'No se pudo generar el link'));
                    return;
                }

                console.log('[Stripe] Link generado exitosamente:', data.url);
                resultDiv.innerHTML = `Link de Stripe (copialo y mandalo):<br><a href="${data.url}" target="_blank" class="text-blue-600 underline break-all">${data.url}</a>`;
                resultDiv.classList.remove('hidden');
            };
        }

        window.openPaymentModal = (email, name) => {
            console.log(`[UI] Abriendo modal simplificado`);
            const modal = document.getElementById('payment-modal');
            
            // Si venimos de un cliente específico, pre-cargamos el concepto
            if (name) {
                document.getElementById('payment-description').value = `Pago de ${name}`;
            } else {
                document.getElementById('payment-description').value = '';
            }

            modal.classList.remove('hidden');
            document.getElementById('payment-result').classList.add('hidden');
        }

        window.closePaymentModal = () => {
            console.log('[UI] Cerrando modal de pago.');
            document.getElementById('payment-modal').classList.add('hidden');
            document.getElementById('payment-form').reset();
        }

        window.openPaymentModalFromDashboard = async () => {
            console.log('[Dashboard] Botón generar link clickeado.');
            await loadPage('clients');
            openPaymentModal('', '');
        }

        window.syncStripeData = async () => {
            if (!confirm('¿Quieres sincronizar los clientes desde Stripe?')) return;
            console.log('[Sync] Iniciando sincronización manual...');
            const btn = document.querySelector('button[onclick="syncStripeData()"]');
            if (!btn) return;
            const originalText = btn.innerHTML;
            
            btn.disabled = true;
            btn.innerHTML = '<span class="material-symbols-outlined animate-spin">refresh</span> Sincronizando...';
            
            const { data, error } = await window.electronAPI.syncStripeCustomers();
            
            btn.disabled = false;
            btn.innerHTML = originalText;
            
            if (error) {
                console.error('[Sync] Error:', error);
                alert('Error al sincronizar: ' + (error.message || error));
            } else {
                console.log('[Sync] Éxito:', data);
                alert('Sincronización completada con éxito.');
                loadClients();
            }
        }

        // Handle navigation clicks
        navItems.forEach(item => {
            item.addEventListener('click', () => {
                loadPage(item.dataset.page);
            });
        });

        // Load default page
        window.addEventListener('DOMContentLoaded', () => {
            loadPage('dashboard');
        });
    </script>
</body>
</html>
